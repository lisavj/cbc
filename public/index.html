    const opening = !typeFilterPanel.classList.contains('open');
    typeFilterPanel.classList.toggle('open');
    if (opening) positionTypeFilterPanel();
  });
  document.addEventListener('click', (e) => {
    if (!typeFilterPanel.contains(e.target) && e.target !== typeFilterBtn) {
      typeFilterPanel.classList.remove('open');
    }
  });
  typeFilterPanel.addEventListener('click', (e) => {
    if (e.target.id === 'typeFilterAll') {
      ALL_TYPE_TITLES.forEach(t => enabledTypes.add(t));
      renderTypeFilterPanel();
      render();
      return;
    }
    if (e.target.id === 'typeFilterNone') {
      enabledTypes.clear();
      renderTypeFilterPanel();
      render();
      return;
    }
    if (e.target.id === 'paMasterCheckbox') {
      const paTitles = ALL_TYPE_TITLES.filter(t => t.startsWith(PRICE_ACTION_PREFIX));
      if (e.target.checked) paTitles.forEach(t => enabledTypes.add(t));
      else paTitles.forEach(t => enabledTypes.delete(t));
      renderTypeFilterPanel();
      render();
      return;
    }
    if (e.target.matches('input[data-type-title]')) {
      const title = decodeURIComponent(e.target.dataset.typeTitle);
      if (e.target.checked) enabledTypes.add(title);
      else enabledTypes.delete(title);
      if (title.startsWith(PRICE_ACTION_PREFIX)) renderTypeFilterPanel(); // keep master row's count/indeterminate state in sync
      render();
    }
  });

  function timeAgo(iso) {
    const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  }

  function classify(text) {
    const t = text.toUpperCase();
    if (t.includes('LONG') || t.includes('BULLISH')) return 'bull';
    if (t.includes('SHORT') || t.includes('BEARISH')) return 'bear';
    return '';
  }

  // Per-row coloring, mirroring the on-chart Status table's logic: bullish/LONG green, bearish/SHORT
  // red, session-colored for the Market row, plain otherwise (Time, Chart, ORB set, EMA comparison
  // lines, etc. don't get a bull/bear read so they stay neutral).
  function classifyRow(key, value) {
    const k = key.toUpperCase();
    const v = value.toUpperCase();
    if (k === 'MARKET') {
      if (v.includes('NEW YORK')) return 'ny';
      if (v.includes('LONDON')) return 'london';
      if (v.includes('ASIAN')) return 'asian';
      return 'neutral';
    }
    if (k.startsWith('STRUCTURE')) {
      // Matches the Pine script's v3.22 rule: green only for a full bullish structure (Higher
      // High AND Higher Low), red only for a full bearish structure (Lower High AND Lower Low).
      // Mixed readings (HH/LL, LH/HL) stay neutral.
      if (v.replace(/\s/g, '') === 'HH/HL') return 'bull';
      if (v.replace(/\s/g, '') === 'LH/LL') return 'bear';
      return 'neutral';
    }
    // "3min - Above Both" / "15min - Below Both" / etc. — the direction lives in the LABEL here,
    // not the value (the value is just the raw EMA9/EMA20/price ordering text).
    if (/^\d+min - /i.test(key)) {
      if (k.includes('ABOVE BOTH')) return 'bull';
      if (k.includes('BELOW BOTH')) return 'bear';
      return 'neutral';
    }
    if (v.includes('BULLISH') || v.startsWith('LONG') || v.includes(' LONG ')) return 'bull';
    if (v.includes('BEARISH') || v.startsWith('SHORT') || v.includes(' SHORT ')) return 'bear';
    if (v.startsWith('ABOVE')) return 'bull';
    if (v.startsWith('BELOW')) return 'bear';
    return 'neutral';
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Converts the "Chart" field's timeframe text (e.g. "3m", "15m", "1H", "4H", "1D") into
  // TradingView's chart URL "interval" format (minutes as a plain number, or D/W/M for daily+).
  function tfToInterval(tf) {
    if (!tf) return null;
    let m = tf.match(/^(\d+)\s*m$/i);
    if (m) return m[1];
    m = tf.match(/^(\d+)\s*h$/i);
    if (m) return String(parseInt(m[1], 10) * 60);
    m = tf.match(/^(\d+)\s*d$/i);
    if (m) return m[1] === '1' ? 'D' : m[1] + 'D';
    m = tf.match(/^(\d+)\s*w$/i);
    if (m) return m[1] === '1' ? 'W' : m[1] + 'W';
    return null;
  }

  // Builds a TradingView chart link from the alert's ticker + "Chart" field, if present. TradingView
  // chart URLs are universal links — on a phone with the TradingView app installed, this hands off to
  // the app automatically; otherwise it opens the web chart in whatever browser you're logged into.
  function buildChartUrl(tickerOnly, rows) {
    if (!tickerOnly) return null;
    const chartField = rows.find(([k]) => k === 'Chart');
    let tf = null;
    if (chartField) {
      const parts = chartField[1].trim().split(/\s+/);
      tf = parts[parts.length - 1]; // "MES1!  3m" -> "3m"
    }
    const interval = tfToInterval(tf);
    let url = 'https://www.tradingview.com/chart/?symbol=' + encodeURIComponent(tickerOnly);
    if (interval) url += '&interval=' + encodeURIComponent(interval);
    return url;
  }

  // "CBC (3m) last flip" etc. normally read like "LONG 7/22 18:51 ET  #1" — too long to fit 3 per
  // row. Drops the date (keeps time) since these are grouped side by side: "LONG 18:51 #1".
  function shortenLastFlip(key, value) {
    if (!key.includes('last flip')) return value;
    const m = value.match(/^(LONG|SHORT)\s+\d{1,2}\/\d{1,2}\s+(\d{1,2}:\d{2})\s+ET\s+(#\d+)/i);
    return m ? `${m[1]} ${m[2]} ${m[3]}` : value;
  }

  // "CBC (3m) last flip" / "CBC (15m) last flip" / "CBC (1H) last flip" as full labels waste
  // horizontal space when shown 3-up in one row — compacted to just "3-"/"15-"/"60-" prefixes.
  function shortenLastFlipLabel(key) {
    if (!key.includes('last flip')) return key;
    const m = key.match(/\((\d+)m\)/) || key.match(/\((1H|60)\)/);
    if (!m) return key;
    const tf = m[1] === '1H' ? '60' : m[1];
    return `${tf}-`;
  }

  // Arranges [key, value] pairs into rows per ROW_GROUPS: each configured group becomes one row
  // (in the order fields are found — a group with a missing field just renders fewer chips that
  // row), and anything left over becomes its own single-field row, in original order.
  function groupRows(rows) {
    const used = new Array(rows.length).fill(false);
    const groupedRows = [];
    ROW_GROUPS.forEach(matchers => {
      const found = [];
      matchers.forEach(prefix => {
        const idx = rows.findIndex((r, i) => !used[i] && r[0].startsWith(prefix));
        if (idx !== -1) {
          used[idx] = true;
          found.push(rows[idx]);
        }
      });
      if (found.length) groupedRows.push(found);
    });
    rows.forEach((r, i) => {
      if (!used[i]) groupedRows.push([r]);
    });
    return groupedRows;
  }

  function render() {
    // Build the symbol tab bar from whatever tickers have shown up so far, preserving the current
    // selection (and falling back to "all" if the selected symbol has since rolled off).
    const symbols = Array.from(new Set(alerts.map(a => getSymbol(a.raw)).filter(Boolean))).sort();
    activeFilter = symbols.includes(activeFilter) ? activeFilter : 'all';
    const countBySymbol = {};
    symbols.forEach(s => { countBySymbol[s] = alerts.filter(a => getSymbol(a.raw) === s).length; });
    symbolTabsEl.innerHTML = `<button class="symbol-tab-btn ${activeFilter === 'all' ? 'active' : ''}" data-symbol="all">All<span class="symbol-tab-count">${alerts.length}</span></button>` +
      symbols.map(s => `<button class="symbol-tab-btn ${activeFilter === s ? 'active' : ''}" data-symbol="${escapeHtml(s)}">${escapeHtml(s)}<span class="symbol-tab-count">${countBySymbol[s]}</span></button>`).join('');
    symbolTabsEl.style.display = chronoView ? 'none' : '';

    const bySymbol = chronoView
      ? alerts.filter(a => chronoSymbolFilter.has(getSymbol(a.raw)))
      : (activeFilter === 'all' ? alerts : alerts.filter(a => getSymbol(a.raw) === activeFilter));
    const filtered = bySymbol.filter(a => {
      const lines = (a.raw || '').split('\n').map(l => l.trim()).filter(l => l.length > 0);
      const headlineLines = lines.filter((l, i) => i === 0 || l.startsWith('•'));
      const types = getAlertTypeTitles(headlineLines);
      // AND logic: a merged alert (e.g. "HTF CBC Flip - Early" + "LTF + HTF Agreement - Early"
      // fired together) only shows while EVERY type it contains is checked. Unchecking any one
      // type immediately hides every alert that includes that condition, even if bundled with
      // other still-enabled types. (Previously used .some(), which only hid an alert once ALL
      // of its bundled types were unchecked — so unchecking a single type on a multi-condition
      // alert appeared to do nothing.)
      return types.every(t => enabledTypes.has(t));
    });

    countEl.textContent = activeFilter === 'all' ? alerts.length : `${filtered.length} of ${alerts.length}`;
    emptyEl.style.display = filtered.length ? 'none' : 'block';
    function renderCard(a) {
      const cbcWire = parseCbcWireAlert(a.raw);
      if (cbcWire) {
        const isExpandedWire = expandedIds.has(a.id);
        const statusCls = cbcWire.isBull === true ? 'status-confirmed' : cbcWire.isBull === false ? 'status-fail' : '';
        const pillCls = cbcWire.isBull === true ? 'pill-flip-long' : cbcWire.isBull === false ? 'pill-flip-short' : 'pill-neutral';
        return `<div class="card ${statusCls} ${isExpandedWire ? 'expanded' : ''}" data-id="${a.id}">
          <div class="card-top" data-toggle="${a.id}">
            <div class="card-top-left">
              <span class="chevron">&#9656;</span>
              <span class="type-pill ${pillCls}">${escapeHtml(cbcWire.tf)}m</span>
              <span class="card-summary">${cbcWire.symbol ? escapeHtml(cbcWire.symbol) : 'CBC Wire'} — ${escapeHtml(cbcWire.summary)}</span>
            </div>
            <div style="display:flex; align-items:baseline; gap:10px; flex-shrink:0;">
              <span class="card-time">${new Date(a.receivedAt).toLocaleString()}</span>
              <span class="card-ago" data-ts="${a.receivedAt}">${timeAgo(a.receivedAt)}</span>
            </div>
          </div>
          <div class="card-headline"><span class="headline-text">${escapeHtml(cbcWire.detail)}</span></div>
        </div>`;
      }

      const body = a.raw || '';
      const lines = body.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      const headlineLines = [];
      const rows = [];
      lines.forEach((line, i) => {
        if (i === 0 || line.startsWith('•')) {
          headlineLines.push(line);
          return;
        }
        const idx = line.indexOf(': ');
        if (idx === -1) return; // skip lines that aren't "Key: Value" (shouldn't be many)
        const key = line.slice(0, idx);
        if (HIDDEN_FIELDS.some(prefix => key.startsWith(prefix))) return;
        rows.push([key, line.slice(idx + 2)]);
      });

      // Fallback for alerts that don't match MapleStax's structured format at all (no parseable
      // "Key: Value" fields found) — e.g. alerts from a completely different indicator/source hitting
      // the same webhook. Render as plain text instead of forcing it into the colored table layout.
      if (rows.length === 0) {
        const plainSummary = lines[0] || '(empty alert)';
        const isExpandedPlain = expandedIds.has(a.id);
        return `<div class="card ${isExpandedPlain ? 'expanded' : ''}" data-id="${a.id}">
          <div class="card-top" data-toggle="${a.id}">
            <div class="card-top-left">
              <span class="chevron">&#9656;</span>
              <span class="card-summary">${escapeHtml(plainSummary)}</span>
            </div>
            <div style="display:flex; align-items:baseline; gap:10px; flex-shrink:0;">
              <span class="card-time">${new Date(a.receivedAt).toLocaleString()}</span>
              <span class="card-ago" data-ts="${a.receivedAt}">${timeAgo(a.receivedAt)}</span>
            </div>
          </div>
          <div class="card-headline"><span class="headline-text" style="color:var(--text); white-space:pre-wrap;">${escapeHtml(lines.join('\n'))}</span></div>
        </div>`;
      }

      // Pull the configured highlight fields up into the headline banner itself, with Bullish/Bearish
      // words colored so direction pops out at a glance.
      const highlightLines = buildHeadlineHighlights(rows);
      const headlineTextHtml = colorizeBullBear(headlineLines.join('\n'));
      const headlineHtml = headlineTextHtml + (highlightLines.length ? '\n' + highlightLines.join('\n') : '');

      const badgeRowHtml = buildBadgeRow(rows, headlineLines);

      // CBC Flip Level: combined into one row (3m/15m/60 side by side) instead of 3 separate
      // full-width rows, formatted as "<price>-<tf>". Colored by the OPPOSITE of that timeframe's
      // CURRENT CBC state — e.g. if CBC15 currently reads Bullish, its flip level is colored RED,
      // since crossing that price is what would flip it TO bearish (the color it's about to
      // become, not the color it currently is).
      const getRow = (label) => { const r = rows.find(([k]) => k === label); return r ? r[1] : null; };
      const oppositeOf = (val) => val === 'Bullish' ? 'bear' : val === 'Bearish' ? 'bull' : 'neutral';
      const flipPrice = (val) => { const m = (val || '').match(/^([\d.]+)/); return m ? m[1] : val; };
      const flip3 = getRow('CBC Flip Level (3m)');
      const flip15 = getRow('CBC Flip Level (15m)');
      const flip60 = getRow('CBC Flip Level (1H)') || getRow('CBC Flip Level (60)');
      const flipLevelRowHtml = (flip3 || flip15 || flip60) ? `<div class="row-group">${
        [
          flip3 ? [flip3, '3', getRow('CBC (3m)')] : null,
          flip15 ? [flip15, '15', getRow('CBC (15m)')] : null,
          flip60 ? [flip60, '60', getMtf(getRow, 'CBC')] : null,
        ].filter(Boolean).map(([val, tf, nowVal]) =>
          `<div class="field ${oppositeOf(nowVal)}"><span class="k">CBC Flip Level</span><span class="v">${escapeHtml(flipPrice(val))}-${tf}</span></div>`
        ).join('')
      }</div>` : '';

      const bodyRows = rows.filter(([k]) =>
        !FIELDS_SHOWN_ONLY_IN_HEADLINE.some(prefix => k.startsWith(prefix)) &&
        !FIELDS_SHOWN_ONLY_AS_BADGES.includes(k)
      );
      const groups = groupRows(bodyRows);
      // groups[0] is always Time/Market, groups[1] is always Chart/Price (per ROW_GROUPS order
      // above) — rendered under a "Context" header, then the same badge row shown up top gets
      // reused verbatim under its own header (guarantees it's pixel-identical, not a re-styled
      // copy), then everything else follows with no header.
      const renderGroup = (group) => {
        const fieldsHtml = group.map(([k, v]) => {
          const displayV = shortenLastFlip(k, v);
          const displayK = shortenLastFlipLabel(k);
          const cls = classifyRow(k, v);
          return `<div class="field ${cls}"><span class="k">${escapeHtml(displayK)}</span><span class="v">${escapeHtml(displayV)}</span></div>`;
        }).join('');
        return `<div class="row-group">${fieldsHtml}</div>`;
      };
      const bodyHtml =
        (groups.slice(0, 2).length ? `<div class="section-label">Context</div>` : '') +
        groups.slice(0, 2).map(renderGroup).join('') +
        flipLevelRowHtml +
        groups.slice(2).map(renderGroup).join('');

      // One-line summary shown in the collapsed header — tightened to match CBC Wire's terse
      // voice-signal phrasing ("3m CBC bullish @ 29548.75", "ydh crossing", "NY ORB-L approaching")
      // instead of the full "<Type>: <Direction> (<detail>)" bullet text. Full detail is still one
      // tap away in the expanded headline/tooltip — this is just what you see scanning the list.
      const tickerOnly = (lines[0] || '').replace(/[—\s]+$/, '');
      const priceNow = (rows.find(([k]) => k === 'Price') || [])[1];

      function buildCompactSummary() {
        const bullet = headlineLines.find(l => l.startsWith('•')) || '';

        // Combined or plain HTF/LTF CBC Flip: "HTF(15) CBC Flip: LONG (confirmed...)" -> "15m CBC bullish"
        let m = bullet.match(/(?:HTF|LTF)\((\d+)\)\s*CBC Flip(?:\s*\+\s*(?:LTF|HTF)\(\d+\)\s*Agreement)?:\s*(LONG|SHORT)/i);
        if (m) return `${tickerOnly} ${m[1]}m CBC ${m[2].toUpperCase() === 'LONG' ? 'bullish' : 'bearish'}${priceNow ? ' @ ' + priceNow : ''}`;

        // Agreement alone: "LTF(3) short + HTF(15) Agreement: SHORT (...)"
        m = bullet.match(/(?:LTF|HTF)\((\d+)\).*?Agreement:\s*(LONG|SHORT)/i);
        if (m) return `${tickerOnly} ${m[1]}m Agreement ${m[2].toUpperCase() === 'LONG' ? 'bullish' : 'bearish'}${priceNow ? ' @ ' + priceNow : ''}`;

        // EMA9/20 Cross: "EMA9/20 Cross: Bullish (crossed above)"
        m = bullet.match(/EMA9\/20 Cross:\s*(Bullish|Bearish)/i);
        if (m) {
          const chartTf = (getRow('Chart') || '').match(/(\d+)m\s*$/);
          return `${tickerOnly}${chartTf ? ' ' + chartTf[1] + 'm' : ''} ema9/20 crossing`;
        }

        // Level Proximity / Key Level Alert: "<Level> Crossing/Approaching: Bullish/Bearish (...)"
        // or "Key Level Alert: <Level> Bullish/Bearish (crossed above/below N)"
        m = bullet.match(/^•\s*Key Level Alert:\s*(\S+)\s+(?:Bullish|Bearish)\s*\(crossed (above|below) ([\d.]+)\)/i);
        if (m) return `${tickerOnly} ${m[1]} crossing${priceNow ? ' @ ' + priceNow : ''}`;
        m = bullet.match(/^•\s*(.+?)\s+(Crossing|Approaching):/i);
        if (m) return `${tickerOnly} ${m[1].toLowerCase()} ${m[2].toLowerCase()}`;

        return null;
      }
      let summaryText = buildCompactSummary() || [tickerOnly, (headlineLines[1] || '').replace(/^•\s*/, '')].filter(Boolean).join(' — ');
      if (classifyTier(headlineLines, a.receivedAt) === 'forming') summaryText += ' - FORMING';
      const isExpanded = expandedIds.has(a.id);
      const chartUrl = buildChartUrl(tickerOnly, rows);
      const statusClass = classifyAlertStatus(headlineLines);
      const typePill = classifyTypePill(headlineLines);
      const typePillHtml = typePill ? `<span class="type-pill ${typePill.cls}">${typePill.label}</span>` : '';

      return `<div class="card ${statusClass} ${isExpanded ? 'expanded' : ''}" data-id="${a.id}">
        <div class="card-top" data-toggle="${a.id}">
          <div class="card-top-left">
            <span class="chevron">&#9656;</span>
            ${typePillHtml}
            <span class="card-summary">${escapeHtml(summaryText)}</span>
          </div>
          <div style="display:flex; align-items:baseline; gap:10px; flex-shrink:0;">
            ${chartUrl ? `<a class="chart-link" href="${chartUrl}" target="_blank" rel="noopener" title="Open chart in TradingView" onclick="event.stopPropagation()">&#128200;</a>` : ''}
            <span class="card-time">${new Date(a.receivedAt).toLocaleString()}</span>
            <span class="card-ago" data-ts="${a.receivedAt}">${timeAgo(a.receivedAt)}</span>
          </div>
        </div>
        ${badgeRowHtml}
        ${headlineLines.length ? `<div class="card-headline"><span class="headline-text">${headlineHtml}</span><span class="info-icon" data-headline="${encodeURIComponent(headlineLines.join('\n'))}">i</span></div>` : ''}
        <div class="field-body">${bodyHtml}</div>
      </div>`;
    }

    // Tier classification: "actionable" alerts have a live, freshly-confirmed setup worth acting
    // on now; "forming" are unconfirmed/early signals or warnings worth watching; everything else
    // ("context") is informational — levels, crosses, proximity, connection pings. CBC Wire and
    // unrecognized types default to context since they carry no trade-entry information.
    const ACTIONABLE_TITLES = new Set([
      'A+ Setup (Long/Short)', 'ORB Retest / Break & Base (Long/Short)', 'Outside HTF ORB (Bullish/Bearish)',
      'Price Enters HTF EMA9/20 Zone - Entry', 'LTF + HTF Agreement (Long/Short)', 'HTF CBC Flip (Long/Short)',
      'LTF CBC Flip (Long/Short)', 'Key Level Alert (PP/R1/R2/R3/S1/S2/S3)',
    ]);
    const FORMING_TITLES = new Set([
      'LTF + HTF Agreement - Early (unconfirmed HTF)', 'HTF CBC Flip - Early (unconfirmed, still forming)',
      'LTF CBC Flip - Early (unconfirmed, mid-candle)', 'ORB Retest Fail (Long/Short)',
    ]);
    // Only these three types are genuinely about a still-open/in-progress candle — "ORB Retest Fail"
    // describes a completed pattern, not an in-progress one, so it's exempt from the window check below.
    const FORMING_CANDLE_TITLES = new Set([
      'LTF + HTF Agreement - Early (unconfirmed HTF)', 'HTF CBC Flip - Early (unconfirmed, still forming)',
      'LTF CBC Flip - Early (unconfirmed, mid-candle)',
    ]);
    // Pulls the relevant still-forming candle's timeframe (in minutes) out of the alert text — prefers
    // HTF(N) when this is an HTF-side early alert, otherwise LTF(N). Returns null if neither is found.
    function extractFormingPeriodMinutes(line) {
      const isHtfEarly = /HTF/i.test(line);
      const htfMatch = line.match(/HTF\((\d+)\)/i);
      const ltfMatch = line.match(/LTF\((\d+)\)/i);
      if (isHtfEarly && htfMatch) return parseInt(htfMatch[1], 10);
      if (ltfMatch) return parseInt(ltfMatch[1], 10);
      if (htfMatch) return parseInt(htfMatch[1], 10);
      return null;
    }
    // True once the alert's own timestamp falls within the last `windowMin` minutes of its candle.
    // Uses the browser's local minute-of-hour, which matches the exchange's minute-of-hour for any
    // standard timeframe (3/5/15/60m etc.) regardless of timezone, since UTC-vs-exchange offsets are
    // always whole hours — only the hour differs, never the minute, so no timezone conversion needed.
    function isInFormingWindow(receivedAt, periodMin, windowMin) {
      if (!periodMin) return true; // couldn't parse a period — don't hide it, fail open
      const d = new Date(receivedAt);
      const secondsIntoHour = d.getMinutes() * 60 + d.getSeconds();
      const secondsIntoPeriod = secondsIntoHour % (periodMin * 60);
      const secondsRemaining = periodMin * 60 - secondsIntoPeriod;
      return secondsRemaining <= windowMin * 60;
    }
    function classifyTier(headlineLines, receivedAt) {
      const types = getAlertTypeTitles(headlineLines);
      if (types.some(t => ACTIONABLE_TITLES.has(t))) return 'actionable';
      const formingCandleType = types.find(t => FORMING_CANDLE_TITLES.has(t));
      if (formingCandleType) {
        const line = headlineLines.find(l => getDefinitionsForHeadline([l]).some(d => d.title === formingCandleType)) || headlineLines.join(' ');
        const periodMin = extractFormingPeriodMinutes(line);
        const windowMin = parseInt(formingWindowEl.value, 10);
        if (!isInFormingWindow(receivedAt, periodMin, windowMin)) return 'hidden';
        return 'forming';
      }
      if (types.some(t => FORMING_TITLES.has(t))) return 'forming';
      return 'context';
    }

    const tierLimitRaw = tierLimitEl.value;
    const tierLimit = tierLimitRaw === 'all' ? Infinity : parseInt(tierLimitRaw, 10);

    if (chronoView) {
      // Chronological view: group by symbol only, no tier classification (and therefore no
      // Forming-window hiding either, since that logic lives inside classifyTier) — just every
      // alert that passed the Alert Types filter, newest first.
      const bySymbolFlat = new Map();
      filtered.forEach(a => {
        const sym = getSymbol(a.raw);
        if (!bySymbolFlat.has(sym)) bySymbolFlat.set(sym, []);
        bySymbolFlat.get(sym).push(a);
      });
      const flatSymbolOrder = Array.from(bySymbolFlat.keys()).sort((s1, s2) => {
        const t = sym => Math.max(...bySymbolFlat.get(sym).map(a => a.receivedAt), 0);
        return t(s2) - t(s1);
      });
      listEl.innerHTML = flatSymbolOrder.map(sym => {
        const items = bySymbolFlat.get(sym);
        const shownItems = items.slice(0, tierLimit);
        const cardsHtml = shownItems.map(renderCard).join('');
        const truncatedNote = shownItems.length < items.length
          ? `<div class="tier-truncated-note">Showing ${shownItems.length} of ${items.length} — raise "Show per tier" above to see more.</div>`
          : '';
        return `<div class="symbol-cockpit">
          <div class="symbol-cockpit-header">${escapeHtml(sym || 'Unknown')} <span class="tier-count">${items.length}</span></div>
          <div class="tier-cards">${cardsHtml}${truncatedNote}</div>
        </div>`;
      }).join('');
      return;
    }

    // Group by symbol (cockpit), then bucket each symbol's alerts into the 3 tiers above.
    const bySymbolGroups = new Map();
    filtered.forEach(a => {
      const sym = getSymbol(a.raw);
      if (!bySymbolGroups.has(sym)) bySymbolGroups.set(sym, { actionable: [], forming: [], context: [] });
      const lines = (a.raw || '').split('\n').map(l => l.trim()).filter(l => l.length > 0);
      const headlineLines = lines.filter((l, i) => i === 0 || l.startsWith('•'));
      const tier = classifyTier(headlineLines, a.receivedAt);
      // 'hidden': a still-forming-candle alert outside its configured "Forming window" — per request,
      // these simply don't display at all (not even under Context) until the candle nears its close.
      if (tier === 'hidden') return;
      bySymbolGroups.get(sym)[tier].push(a);
    });
    // Symbols ordered by most recent activity (their newest alert's timestamp), matching the
    // existing "most recent first" expectation from the old flat chronological feed.
    const symbolOrder = Array.from(bySymbolGroups.keys()).sort((s1, s2) => {
      const t = sym => Math.max(...['actionable', 'forming', 'context'].flatMap(k => bySymbolGroups.get(sym)[k].map(a => a.receivedAt)), 0);
      return t(s2) - t(s1);
    });

    const TIER_META = {
      actionable: { label: 'Actionable now', cls: 'tier-actionable' },
      forming: { label: 'Forming', cls: 'tier-forming' },
      context: { label: 'Context', cls: 'tier-context' },
    };
    listEl.innerHTML = symbolOrder.map(sym => {
      const g = bySymbolGroups.get(sym);
      const tiersHtml = ['actionable', 'forming', 'context'].map(tier => {
        const items = g[tier];
        if (!items.length) return '';
        const meta = TIER_META[tier];
        // Items are already newest-first (alerts arrive via unshift), so slicing the first N here
        // keeps the most recent ones — the count badge below still shows the TRUE total, uncapped.
        const shownItems = items.slice(0, tierLimit);
        const cardsHtml = shownItems.map(renderCard).join('');
        const truncatedNote = shownItems.length < items.length
          ? `<div class="tier-truncated-note">Showing ${shownItems.length} of ${items.length} — raise "Show per tier" above to see more.</div>`
          : '';
        const tierKey = `${sym}::${tier}`;
        if (!seenTierKeys.has(tierKey)) {
          seenTierKeys.add(tierKey);
          collapsedTiers.add(tierKey); // default: collapsed until the user opens it
        }
        const isCollapsed = collapsedTiers.has(tierKey);
        return `<div class="tier-section ${meta.cls}">
          <div class="tier-label ${isCollapsed ? 'collapsed' : ''}" data-tier-key="${escapeHtml(tierKey)}"><span class="tier-chevron">▾</span>${meta.label} <span class="tier-count">${items.length}</span></div>
          <div class="tier-cards ${isCollapsed ? 'collapsed' : ''}">${cardsHtml}${truncatedNote}</div>
        </div>`;
      }).join('');
      return `<div class="symbol-cockpit">
        <div class="symbol-cockpit-header">${escapeHtml(sym || 'Unknown')}</div>
        ${tiersHtml}
      </div>`;
    }).join('');
  }

  function tickAgo() {
    document.querySelectorAll('.card-ago').forEach(el => {
      el.textContent = timeAgo(el.dataset.ts);
    });
  }
  setInterval(tickAgo, 15000);

  // Event delegation: card headers are recreated on every render() call (new alert arriving etc.),
  // so listen on the shared container instead of attaching a listener per card.
  listEl.addEventListener('click', (e) => {
    const headline = e.target.closest('.info-icon');
    if (headline) {
      const lines = decodeURIComponent(headline.dataset.headline).split('\n');
      showDefinitions(lines);
      return;
    }
    const tierLabel = e.target.closest('.tier-label');
    if (tierLabel) {
      const key = tierLabel.dataset.tierKey;
      const cardsEl = tierLabel.nextElementSibling;
      if (collapsedTiers.has(key)) {
        collapsedTiers.delete(key);
        tierLabel.classList.remove('collapsed');
        cardsEl.classList.remove('collapsed');
      } else {
        collapsedTiers.add(key);
        tierLabel.classList.add('collapsed');
        cardsEl.classList.add('collapsed');
      }
      return;
    }
    const header = e.target.closest('[data-toggle]');
    if (!header) return;
    const id = header.dataset.toggle;
    const card = header.closest('.card');
    if (expandedIds.has(id)) {
      expandedIds.delete(id);
      card.classList.remove('expanded');
    } else {
      expandedIds.add(id);
      card.classList.add('expanded');
    }
  });

  const defModal = document.getElementById('defModal');
  const defModalBox = document.getElementById('defModalBox');

  function showDefinitions(headlineLines) {
    const defs = getDefinitionsForHeadline(headlineLines);
    const content = defs.length
      ? defs.map(d => `<h3>${escapeHtml(d.title)}</h3><p>${escapeHtml(d.def)}</p>`).join('')
      : '<p class="none">No matching alert-type definition found for this headline.</p>';
    defModalBox.innerHTML = content + '<button class="modal-close" id="defModalCloseBtn">Close</button>';
    defModal.classList.add('open');
    document.getElementById('defModalCloseBtn').addEventListener('click', () => defModal.classList.remove('open'));
  }

  defModal.addEventListener('click', (e) => {
    if (e.target === defModal) defModal.classList.remove('open');
  });

  function flashPulse() {
    pulseEl.classList.add('live');
    setTimeout(() => pulseEl.classList.remove('live'), 1500);
  }

  // Initial load
  fetch('/alerts').then(r => r.json()).then(data => {
    alerts = data;
    render();
  });

  // Live stream
  const es = new EventSource('/stream');
  es.onopen = () => { connEl.textContent = 'live'; };
  es.onerror = () => { connEl.textContent = 'reconnecting…'; };
  es.onmessage = (e) => {
    const alert = JSON.parse(e.data);
    alerts.unshift(alert);
    render();
    flashPulse();
    if (voiceOn) speakAlert(alert);
  };

  downloadBtn.addEventListener('click', () => {
    const toExport = activeFilter === 'all' ? alerts : alerts.filter(a => getSymbol(a.raw) === activeFilter);
    if (!toExport.length) { alert('No alerts to download.'); return; }
    const blob = new Blob([JSON.stringify(toExport, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().replace(/[:.]/g, '-');
    const label = activeFilter === 'all' ? 'all' : activeFilter.replace(/[^a-zA-Z0-9]/g, '');
    a.href = url;
    a.download = `alerts-${label}-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  clearBtn.addEventListener('click', () => {
    if (!confirm('Clear all stored alerts?')) return;
    const token = prompt('Enter your webhook token to confirm (leave blank if you did not set one):') || '';
    fetch('/clear?token=' + encodeURIComponent(token), { method: 'POST' }).then(r => {
      if (r.ok) { alerts = []; render(); }
      else alert('Could not clear (check token).');
    });
  });
</script>

</body>
</html>
