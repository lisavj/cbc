<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alert Feed</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #12161f;
    --panel-border: #1f2530;
    --text: #e5e9f0;
    --muted: #6b7280;
    --accent: #f5a623;
    --bull: #22c55e;
    --bear: #ef4444;
    --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px 20px;
    padding: 14px 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--panel-border);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .brand b { color: var(--text); }
  .pulse {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .pulse.live {
    background: var(--bull);
    box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6);
    animation: ping 1.8s ease-out infinite;
  }
  @keyframes ping {
    0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.55); }
    70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
    100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
  }
  .stats {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    display: flex;
    gap: 18px;
  }
  .stats strong { color: var(--accent); font-weight: 600; }
  .actions button {
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--muted);
    font-family: var(--sans);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  .actions button:hover { color: var(--text); border-color: var(--muted); }

  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 20px;
  }
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 14px;
  }
  .empty .big { font-size: 28px; margin-bottom: 10px; color: var(--panel-border); }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 14px;
    animation: slidein 0.25s ease-out;
  }
  /* Status border colors: A+ Setup alerts get blue, confirmed alerts get green, and
     early/unconfirmed alerts get yellow — matches how these are eyeballed on the chart. */
  .card.status-aplus { border: 2px solid #22d3ee; }
  .card.status-confirmed { border: 2px solid #22c55e; }
  .card.status-unconfirmed { border: 2px solid #fde047; }
  .card.status-fail { border: 2px solid #ef4444; }
  @keyframes slidein {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 14px;
    background: #060810;
    cursor: pointer;
    user-select: none;
    gap: 10px;
  }
  .card-top:hover { background: #0c0f18; }
  .card-top-left {
    display: flex;
    align-items: baseline;
    gap: 10px;
    min-width: 0;
  }
  .chevron {
    display: inline-block;
    color: var(--muted);
    font-size: 11px;
    transition: transform 0.15s ease;
    flex-shrink: 0;
  }
  .card.expanded .chevron { transform: rotate(90deg); color: var(--accent); }
  .card-summary {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-time {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
  }
  .card-ago {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }
  .chart-link {
    text-decoration: none;
    font-size: 14px;
    opacity: 0.7;
  }
  .chart-link:hover { opacity: 1; }
  .card-headline,
  .field-body {
    display: none;
  }
  .card.expanded .card-headline {
    display: block;
  }
  .card.expanded .field-body {
    display: block;
  }
  .card-headline {
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.5;
    padding: 10px 14px;
    background: #1a1300;
    color: var(--accent);
    border-bottom: 1px solid var(--panel-border);
    white-space: pre-wrap;
    word-break: break-word;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .headline-text { flex: 1 1 auto; }
  .info-icon {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: rgba(245,166,35,0.25);
    color: var(--accent);
    font-size: 11px;
    font-weight: 700;
    font-family: var(--sans);
    cursor: help;
    user-select: none;
  }
  .info-icon:hover { background: rgba(245,166,35,0.45); }
  .hl-bull { color: #4ade80; font-weight: 700; }
  .hl-bear { color: #f87171; font-weight: 700; }

  /* Type pill (FLIP / AGREEMENT / EMA ZONE / A+) sits inline in the headline row, next to the info icon. */
  .type-pill {
    flex-shrink: 0;
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 9999px;
    white-space: nowrap;
  }
  .type-pill.pill-flip-confirmed,
  .type-pill.pill-agreement-confirmed { background: #3b6d11; color: #eaf3de; }
  .type-pill.pill-flip-unconfirmed,
  .type-pill.pill-agreement-unconfirmed { background: #854f0b; color: #faeeda; }
  .type-pill.pill-agreement { background: #534ab7; color: #eeedfe; }
  .type-pill.pill-emazone { background: #993c1d; color: #faece7; }
  .type-pill.pill-aplus { background: #185fa5; color: #e6f1fb; }
  .type-pill.pill-neutral { background: #444441; color: #d3d1c7; }
  .type-pill.pill-orbfail { background: #a32d2d; color: #fcebeb; }

  /* Single-line badge strip: CONFIRMED/UNCONFIRMED, then CBC3/15/60, then ST3/15/60, then EMA3/15/60 —
     always visible (even collapsed), unlike .card-headline/.field-body below which stay expand-only. */
  .badge-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    font-family: var(--mono);
    padding: 8px 14px;
    border-bottom: 1px solid var(--panel-border);
  }
  .badge-row .badge {
    font-size: 10px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 9999px;
    white-space: nowrap;
  }
  .badge-row .badge-divider {
    color: var(--panel-border);
    font-size: 11px;
  }
  .badge.badge-confirmed { background: #3b6d11; color: #eaf3de; }
  .badge.badge-unconfirmed { background: #854f0b; color: #faeeda; }
  .badge.badge-bull { background: #3b6d11; color: #eaf3de; }
  .badge.badge-bear { background: #a32d2d; color: #fcebeb; }
  .badge.badge-neutral { background: #444441; color: #d3d1c7; }
  /* Ring around a CBC badge whose LIVE/still-forming reading has diverged from the last CONFIRMED
     reading — i.e. it's mid-flip. Ring color is the LIVE direction, independent of the badge's own
     fill (which stays the CONFIRMED direction) — e.g. a red CBC15 badge with a green ring means
     "last confirmed bar was Bearish, but the live/still-forming bar is already reading Bullish". */
  .badge.badge-ring-bull { box-shadow: 0 0 0 2px #4ade80; }
  .badge.badge-ring-bear { box-shadow: 0 0 0 2px #f87171; }

  /* Colors-off ("plain mode"): neutralizes every colored row/badge/highlight in the app. */
  body.plain-mode .field.bull,
  body.plain-mode .field.bear,
  body.plain-mode .field.ny,
  body.plain-mode .field.london,
  body.plain-mode .field.asian {
    background: #0e1219 !important;
  }
  body.plain-mode .field.bull .v,
  body.plain-mode .field.bear .v,
  body.plain-mode .field.ny .v,
  body.plain-mode .field.london .v,
  body.plain-mode .field.asian .v {
    color: var(--text) !important;
  }
  body.plain-mode .hl-bull,
  body.plain-mode .hl-bear {
    color: inherit !important;
    font-weight: inherit !important;
  }
  body.plain-mode .badge,
  body.plain-mode .type-pill {
    background: #262b33 !important;
    color: var(--text) !important;
    box-shadow: none !important;
  }
  body.plain-mode .card.status-aplus,
  body.plain-mode .card.status-confirmed,
  body.plain-mode .card.status-unconfirmed,
  body.plain-mode .card.status-fail {
    border-color: var(--panel-border) !important;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    max-width: 480px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    padding: 18px 20px;
    font-family: var(--sans);
  }
  .modal-box h3 {
    margin: 0 0 4px;
    font-family: var(--mono);
    font-size: 14px;
    color: var(--accent);
  }
  .modal-box p {
    margin: 6px 0 16px;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--text);
  }
  .modal-box .none {
    color: var(--muted);
    font-size: 13px;
  }
  .modal-close {
    display: block;
    margin: 8px auto 0;
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--muted);
    padding: 6px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-family: var(--sans);
    font-size: 12.5px;
  }
  .modal-close:hover { color: var(--text); border-color: var(--muted); }
  .row-group {
    display: flex;
    flex-wrap: wrap;
    border-top: 2px solid #ffffff;
  }
  .row-group:last-child { border-bottom: 2px solid #ffffff; }
  .field {
    flex: 1 1 0;
    min-width: 90px;
    border-right: 2px solid #ffffff;
    padding: 7px 12px;
    font-family: var(--mono);
    font-size: 12.5px;
  }
  .field:last-child { border-right: none; }
  .field .k {
    display: block;
    color: #cbd5e1;
    font-size: 10.5px;
    margin-bottom: 2px;
  }
  .field .v {
    display: block;
    font-weight: 600;
    word-break: break-word;
  }
  .field.bull { background: rgba(34,197,94,0.28); }
  .field.bull .v { color: #bbf7d0; }
  .field.bear { background: rgba(239,68,68,0.28); }
  .field.bear .v { color: #fecaca; }
  .field.neutral { background: #0e1219; }
  .field.ny { background: #ff9800; }
  .field.ny .v { color: #3d1e00; }
  .field.london { background: #9c27b0; }
  .field.london .v { color: #fff; }
  .field.asian { background: #e65100; }
  .field.asian .v { color: #fff; }

  /* Phones: smaller text, chips can drop to a bit narrower before wrapping. */
  @media (max-width: 560px) {
    main { padding: 12px; }
    .card-top { flex-direction: column; align-items: flex-start; gap: 4px; }
    .card-summary { max-width: 100%; }
    .field { min-width: 78px; font-size: 11.5px; padding: 6px 9px; }
    .field .k { font-size: 9.5px; }
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #symbolFilter {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  #symbolFilter:focus { outline: 1px solid var(--accent); }
  .type-filter-wrap { position: relative; }
  #typeFilterBtn {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  #typeFilterBtn:hover { border-color: var(--muted); }
  .type-filter-panel {
    display: none;
    /* position is set inline via JS (positionTypeFilterPanel) as position:fixed, clamped to
       the viewport — CSS top/right below are just an unused fallback in case JS hasn't run yet. */
    position: fixed;
    top: 0;
    right: 0;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 10px;
    width: 260px;
    max-width: calc(100vw - 16px);
    max-height: 60vh;
    overflow-y: auto;
    z-index: 50;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .type-filter-panel.open { display: block; }
  .type-filter-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 2px;
    font-family: var(--sans);
    font-size: 12.5px;
    color: var(--text);
    cursor: pointer;
  }
  .type-filter-row input { flex-shrink: 0; }
  .type-filter-actions {
    display: flex;
    justify-content: space-between;
    padding-top: 6px;
    margin-top: 6px;
    border-top: 1px solid var(--panel-border);
  }
  .type-filter-actions button {
    background: transparent;
    border: none;
    color: var(--accent);
    font-size: 11.5px;
    cursor: pointer;
    padding: 2px 4px;
  }
  .ext-links {
    display: flex;
    gap: 14px;
    font-family: var(--mono);
    font-size: 12px;
  }
  .ext-links a {
    color: var(--muted);
    text-decoration: none;
  }
  .ext-links a:hover { color: var(--accent); }

  footer {
    text-align: center;
    padding: 30px 20px 50px;
    color: var(--panel-border);
    font-family: var(--mono);
    font-size: 11px;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="pulse" id="pulse"></span>
    <span>Alert Feed <b id="conn">connecting…</b></span>
  </div>
  <div class="stats">
    <span><strong id="count">0</strong> received</span>
  </div>
  <div class="ext-links">
    <a href="https://www.forexfactory.com/" target="_blank" rel="noopener">forex</a>
    <a href="https://www.financialjuice.com/home" target="_blank" rel="noopener">News</a>
  </div>
  <div class="actions">
    <select id="symbolFilter">
      <option value="all">All symbols</option>
    </select>
    <div class="type-filter-wrap">
      <button id="typeFilterBtn">Alert Types ▾</button>
      <div class="type-filter-panel" id="typeFilterPanel"></div>
    </div>
    <button id="colorToggleBtn">Colors: On</button>
    <button id="downloadBtn">Download</button>
    <button id="clearBtn">Clear all</button>
  </div>
</header>

<main>
  <div id="list"></div>
  <div class="empty" id="emptyState" style="display:none;">
    <div class="big">···</div>
    Waiting for the first alert.<br />
    Point a TradingView alert's webhook URL here and it'll show up instantly.
  </div>
</main>

<footer>tv-webhook-dashboard</footer>

<div class="modal-overlay" id="defModal">
  <div class="modal-box" id="defModalBox"></div>
</div>

<script>
  const listEl = document.getElementById('list');
  const countEl = document.getElementById('count');
  const emptyEl = document.getElementById('emptyState');
  const connEl = document.getElementById('conn');
  const pulseEl = document.getElementById('pulse');
  const clearBtn = document.getElementById('clearBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const colorToggleBtn = document.getElementById('colorToggleBtn');
  let colorsOn = true;
  colorToggleBtn.addEventListener('click', () => {
    colorsOn = !colorsOn;
    document.body.classList.toggle('plain-mode', !colorsOn);
    colorToggleBtn.textContent = colorsOn ? 'Colors: On' : 'Colors: Off';
  });
  const symbolFilterEl = document.getElementById('symbolFilter');
  symbolFilterEl.addEventListener('change', () => {
    activeFilter = symbolFilterEl.value;
    render();
  });

  let alerts = [];
  let activeFilter = 'all';
  const expandedIds = new Set();

  // Extracts the ticker from an alert's raw text (its first line, e.g. "MES1! —" -> "MES1!").
  function getSymbol(raw) {
    const firstLine = (raw || '').split('\n')[0] || '';
    return firstLine.replace(/[—\s]+$/, '').trim();
  }

  // ---------------------------------------------------------------------
  // ROW GROUPING — edit this to control exactly which fields share a row.
  // Each inner array = one row, listing 1-3 (or more) field labels that should
  // sit side by side. Matching is by PREFIX (so "CBC (15m" also matches
  // "CBC (15m, live/unconfirmed)"). Order here also sets the display order.
  // Anything from an alert that ISN'T listed below just falls back to its
  // own full-width row, in the order it appeared — so new/unlisted fields
  // never get silently dropped, they just aren't grouped.
  // ---------------------------------------------------------------------
  const ROW_GROUPS = [
    ['Time', 'Market'],
    ['Chart', 'Price'],
    ['CBC (3m)'],
    ['CBC (15m)', 'CBC (15m, live'],
    ['CBC (1H)', 'CBC (1H, live'],
    ['Opening range', 'ORB set'],
    ['Structure (3m)', 'Structure (15m)', 'Structure (1H)'],
    ['EMA cloud (3m)', 'EMA cloud (15m)', 'EMA cloud (1H)'],
    ['VWAP', 'EMA 200'],
    ['EMA9/20 (3)', 'EMA9/20 (15)'],
    ['CBC (3m) last flip', 'CBC (15m) last flip', 'CBC (1H) last flip'],
  ];

  // Fields whose label starts with any of these are dropped entirely from the dashboard — not
  // grouped, not shown standalone, just skipped. Edit this list to hide/unhide fields.
  const HIDDEN_FIELDS = ['Prev Candle', 'HTF Candle'];

  // Fields that are hidden from the raw field-body table specifically because
  // buildHeadlineHighlights already folds them into a compact headline line — unlike
  // HIDDEN_FIELDS above, these must stay in `rows` (that's what buildHeadlineHighlights reads),
  // they're just excluded when building the field-body rows further down.
  const FIELDS_SHOWN_ONLY_IN_HEADLINE = [
    'Entry Zone High', 'Entry Zone Low', 'Entry Zone',
    'Buy Zone High', 'Buy Zone Low',
    'Entry', 'Suggested stop',
  ];

  // Builds the extra lines appended into the headline banner, below the bullet points. Edit this
  // function to change which fields combine onto which line, or the separator between them.
  function buildHeadlineHighlights(rows) {
    const get = (label) => {
      const r = rows.find(([k]) => k === label);
      return r ? r[1] : null;
    };
    const lines = [];

    const struct15 = get('Structure (15m)');
    const cloud15 = get('EMA cloud (15m)');
    if (struct15 || cloud15) {
      const raw = [
        struct15 ? `Structure (15m): ${struct15}` : '',
        cloud15 ? `EMA cloud (15m): ${cloud15}` : '',
      ].filter(Boolean).join('   ');
      lines.push(colorizeBullBear(raw));
    }

    const cloudMtf = get('EMA cloud (1H)'); // MTF = Max Timeframe, defaults to 60min/1H
    const structMtf = get('Structure (1H)');
    if (cloudMtf || structMtf) {
      const raw = [
        cloudMtf ? `EMA Cloud(MTF): ${cloudMtf}` : '',
        structMtf ? `Structure (MTF): ${structMtf}` : '',
      ].filter(Boolean).join('   *   ');
      lines.push(colorizeBullBear(raw));
    }

    // Support both the current "Entry Zone High/Low" naming and the older pre-rename "Buy Zone
    // High/Low" naming some live alerts still send, so this compacts either way.
    const buyHigh = get('Entry Zone High') || get('Buy Zone High');
    const buyLow = get('Entry Zone Low') || get('Buy Zone Low');
    const zoneDir = get('Entry Zone'); // "LONG" or "SHORT" — only present on the newer naming
    if (buyHigh || buyLow) {
      const priceStr = get('Price');
      const priceNum = parseFloat(priceStr);
      const lowNum = parseFloat(buyLow);
      const highNum = parseFloat(buyHigh);
      const inZone = !isNaN(priceNum) && !isNaN(lowNum) && !isNaN(highNum) && priceNum >= lowNum && priceNum <= highNum;
      const priceLabel = inZone ? 'Enter Price' : 'Price';
      const buyText = `Entry Zone: ${buyLow || '—'} to ${buyHigh || '—'}  (${priceLabel}: ${priceStr || '—'})`;
      const dirClass = zoneDir === 'LONG' ? 'hl-bull' : zoneDir === 'SHORT' ? 'hl-bear' : null;
      lines.push(dirClass ? `<span class="${dirClass}">${escapeHtml(buyText)}</span>` : escapeHtml(buyText));
    }

    // The suggested entry price (A+ Setup / ORB Retest) and stop (EMA9/20 Zone entries) — same
    // "look for entry" moment as the zone above, so it's folded onto its own compact line rather
    // than left as a separate full-width field-body row.
    const entryLine = get('Entry');
    const stopLine = get('Suggested stop');
    if (entryLine || stopLine) {
      const parts = [
        entryLine ? `Entry: ${entryLine}` : '',
        stopLine ? `Stop: ${stopLine}` : '',
      ].filter(Boolean).join('   ');
      lines.push(escapeHtml(parts));
    }

    return lines;
  }

  // Escapes text, then colors "Bullish"/"LONG"/"HH / HL" green and "Bearish"/"SHORT"/"LH / LL" red
  // — used only for the headline highlight lines, so key directional words pop out at a glance.
  // Mixed structure readings (HH/LL, LH/HL) are left uncolored, matching the table's own rule.
  function colorizeBullBear(text) {
    return escapeHtml(text)
      .replace(/\b(Bullish|LONG)\b/g, '<span class="hl-bull">$1</span>')
      .replace(/\b(Bearish|SHORT)\b/g, '<span class="hl-bear">$1</span>')
      .replace(/\bHH\s*\/\s*HL\b/g, '<span class="hl-bull">HH / HL</span>')
      .replace(/\bLH\s*\/\s*LL\b/g, '<span class="hl-bear">LH / LL</span>')
      .replace(/\b(confirmed)\b/gi, '<span class="hl-bull">$1</span>');
  }

  // ---------------------------------------------------------------------
  // ALERT TYPE DEFINITIONS — same text as the (i) tooltips next to each alert
  // checkbox in the Pine script's Alerts settings group. Checked in order,
  // first match per headline bullet line wins. Update this if the script's
  // own tooltips change, to keep them in sync.
  // ---------------------------------------------------------------------
  const ALERT_TYPE_DEFS = [
    {
      test: (l) => /Price Enters HTF EMA9\/20 Zone/i.test(l),
      title: 'Price Enters HTF EMA9/20 Zone - Entry',
      def: 'Fires once when: the CONFIRMED HTF direction is bullish (or bearish), AND price just entered the zone BETWEEN the HTF\'s own EMA9 and EMA20 (having been outside it the prior bar) — a pullback into the HTF\'s own moving-average zone during an already-established trend, worth watching for an entry. Message includes a suggested stop-loss at the HTF\'s own EMA20 level.'
    },
    {
      test: (l) => /A\+ Setup/i.test(l),
      title: 'A+ Setup (Long/Short)',
      def: 'Fires once when: (1) confirmed HTF CBC direction, (2) chart-timeframe EMA cloud, and (3) HTF EMA cloud all align in the same direction, (4) price is already CONFIRMED on the trade\'s side of VWAP (above VWAP for Long, below VWAP for Short), AND (5) price is still ANTICIPATORY on the Opening Range — hasn\'t broken the ORB high (Long) / ORB low (Short) yet, i.e. before that breakout confirms.'
    },
    {
      test: (l) => /ORB Retest Fail/i.test(l),
      title: 'ORB Retest Fail (Long/Short)',
      def: 'Fires once when an ORB Retest / Break & Base setup fails: price broke out beyond the ORB high (Long) or low (Short), then fully round-tripped through the OPPOSITE side of the range before ever confirming the base — invalidating the setup. The other outcome of the same setup as "ORB Retest / Break & Base" below, gated by the same alert toggle.'
    },
    {
      test: (l) => /ORB Retest/i.test(l),
      title: 'ORB Retest / Break & Base (Long/Short)',
      def: 'Fires once on the classic ORB playbook: (1) price already closed outside the session\'s Opening Range (the initial breakout), (2) price pulled back and retested the broken level from the other side, and (3) a bar then closed back in the breakout direction, confirming the level flipped from resistance to support (Long) or support to resistance (Short). Only fires within the configured "Max bars to wait for retest" of the original breakout.'
    },
    {
      test: (l) => /Outside HTF ORB/i.test(l),
      title: 'Outside HTF ORB (Bullish/Bearish)',
      def: 'Fires once when price closes outside the current session\'s Opening Range — above the ORB high (Bullish) or below the ORB low (Bearish). Uses whichever session\'s OR is currently active (Asian/London/New York).'
    },
    {
      test: (l) => /VWAP Break/i.test(l),
      title: 'VWAP Break (Bullish/Bearish)',
      def: 'Fires once when price closes on the opposite side of VWAP from where it was the prior bar (a VWAP cross), either direction.'
    },
    {
      test: (l) => /EMA 200 Break/i.test(l),
      title: 'EMA 200 Break (Bullish/Bearish)',
      def: 'Fires once when price closes on the opposite side of EMA 200 from where it was the prior bar (an EMA200 cross), either direction.'
    },
    {
      test: (l) => /Agreement/i.test(l) && /early\/unconfirmed/i.test(l),
      title: 'LTF + HTF Agreement - Early (unconfirmed HTF)',
      def: 'Fires once, as soon as the chart timeframe agrees with the HTF\'s LIVE, still-forming state — before that HTF bar closes, tagged UNCONFIRMED. If the live HTF state reverses before its bar closes, no confirmed alert follows — you only got the early heads-up. If it holds, a confirmed "LTF + HTF Agreement" alert fires automatically once that HTF bar closes.'
    },
    {
      test: (l) => /Agreement/i.test(l),
      title: 'LTF + HTF Agreement (Long/Short)',
      def: 'Fires the moment the chart timeframe and the CONFIRMED (last closed) HTF bar both agree — both Long or both Short — i.e. entering agreement, not repeated every bar while still in agreement.'
    },
    {
      test: (l) => /HTF\(/i.test(l) && /CBC Flip/i.test(l) && /(UNCONFIRMED|still forming)/i.test(l),
      title: 'HTF CBC Flip - Early (unconfirmed, still forming)',
      def: 'Fires once, as soon as the HTF\'s LIVE, still-forming state would flip — before that HTF bar closes, tagged UNCONFIRMED. If the live HTF state reverses before its bar closes, no confirmed alert follows. If it holds, a confirmed "HTF CBC Flip" alert fires automatically once that HTF bar closes.'
    },
    {
      test: (l) => /HTF\(/i.test(l) && /CBC Flip/i.test(l),
      title: 'HTF CBC Flip (Long/Short)',
      def: 'Fires once the HTF bar has fully CLOSED and its CBC flipped (last closed HTF bar only). Confirmed — won\'t fire on a signal that reverses before that HTF bar closes.'
    },
    {
      test: (l) => /LTF\(/i.test(l) && /CBC Flip/i.test(l) && /(UNCONFIRMED|mid-candle)/i.test(l),
      title: 'LTF CBC Flip - Early (unconfirmed, mid-candle)',
      def: 'Fires once, as soon as the LIVE still-forming candle would trigger a flip — before the bar closes, tagged UNCONFIRMED. If price reverses before close, no confirmed alert follows. If it holds, a confirmed "LTF CBC Flip" alert fires automatically at that bar\'s actual close.'
    },
    {
      test: (l) => /LTF\(/i.test(l) && /CBC Flip/i.test(l),
      title: 'LTF CBC Flip (Long/Short)',
      def: 'Fires once the bar has fully CLOSED and the chart-timeframe CBC flipped. Confirmed — won\'t fire on a signal that reverses before close.'
    },
  ];

  function getDefinitionsForHeadline(headlineLines) {
    const bulletLines = headlineLines.filter(l => l.startsWith('•'));
    const seen = new Set();
    const results = [];
    bulletLines.forEach(line => {
      const match = ALERT_TYPE_DEFS.find(d => d.test(line));
      if (match && !seen.has(match.title)) {
        seen.add(match.title);
        results.push(match);
      }
    });
    return results;
  }

  const OTHER_TYPE = 'Other (unrecognized)';
  const ALL_TYPE_TITLES = ALERT_TYPE_DEFS.map(d => d.title).concat([OTHER_TYPE]);
  const enabledTypes = new Set(ALL_TYPE_TITLES); // all enabled by default

  // Card border color: A+ Setup alerts are always confirmed-only (per the Pine script, they
  // only ever fire in the confirmed batch), so they get their own distinct color rather than
  // just falling under "confirmed". ORB Retest Fail is technically a "confirmed" (certain, not
  // early/unconfirmed) outcome too, but it's bad news, not a setup to act on — so it gets its own
  // red border rather than the same green as an actionable confirmed setup. Otherwise: any
  // UNCONFIRMED/early bullet -> yellow border, no such bullet (and at least one bullet at all) ->
  // green border. Alerts with no parseable bullets (the plain-text fallback path) get no status
  // class / default border.
  function classifyAlertStatus(headlineLines) {
    const bulletLines = headlineLines.filter(l => l.startsWith('•'));
    if (!bulletLines.length) return '';
    const joined = bulletLines.join(' ');
    if (/A\+ Setup/i.test(joined)) return 'status-aplus';
    if (/ORB Retest Fail/i.test(joined)) return 'status-fail';
    if (/UNCONFIRMED|early\/unconfirmed/i.test(joined)) return 'status-unconfirmed';
    return 'status-confirmed';
  }

  // Small colored pill for the headline row: what KIND of confirmed setup this is (flip, agreement,
  // EMA zone touch, or A+). Independent of classifyAlertStatus's confirmed/unconfirmed border — this
  // is about the setup family, not how sure we are of it.
  function classifyTypePill(headlineLines) {
    const bulletLines = headlineLines.filter(l => l.startsWith('•'));
    if (!bulletLines.length) return null;
    const joined = bulletLines.join(' ');
    const isUnconfirmed = /UNCONFIRMED|early\/unconfirmed/i.test(joined);
    if (/A\+ Setup/i.test(joined)) return { label: 'A+', cls: 'pill-aplus' };
    // FLIP is the one pill whose color tracks confirmation state directly (green = confirmed,
    // yellow = still early/unconfirmed), since a flip's whole meaning changes on whether the HTF
    // bar has actually closed yet — unlike the other types where confirmed/unconfirmed is already
    // covered by the CONFIRMED/UNCONFIRMED badge alone.
    if (/CBC Flip/i.test(joined)) return { label: 'FLIP', cls: isUnconfirmed ? 'pill-flip-unconfirmed' : 'pill-flip-confirmed' };
    if (/Agreement/i.test(joined)) return { label: 'AGREEMENT', cls: isUnconfirmed ? 'pill-agreement-unconfirmed' : 'pill-agreement-confirmed' };
    if (/EMA9\/20 Zone/i.test(joined)) return { label: 'EMA ZONE', cls: 'pill-emazone' };
    // Remaining alert types don't have a dedicated color yet — shown as a plain gray pill rather than
    // inventing new colors for them.
    if (/VWAP Break/i.test(joined)) return { label: 'VWAP', cls: 'pill-neutral' };
    if (/EMA 200 Break/i.test(joined)) return { label: 'EMA200', cls: 'pill-neutral' };
    if (/ORB Retest Fail/i.test(joined)) return { label: 'ORB FAIL', cls: 'pill-orbfail' };
    if (/ORB Retest/i.test(joined)) return { label: 'ORB RETEST', cls: 'pill-neutral' };
    if (/Outside HTF ORB/i.test(joined)) return { label: 'ORB', cls: 'pill-neutral' };
    return null;
  }

  // Splits a "Structure (Nm)" value like "HH / HL" into its Higher-High/Lower-High and
  // Higher-Low/Lower-Low halves and classifies bull (both High side) / bear (both Low side) /
  // neutral (mixed) — matching the Pine script's own stricter "both sides must agree" coloring rule.
  function structureDirClass(value) {
    if (!value) return null;
    const parts = value.split('/').map(s => s.trim());
    const hi = parts[0], lo = parts[1];
    if (hi === 'HH' && lo === 'HL') return 'badge-bull';
    if (hi === 'LH' && lo === 'LL') return 'badge-bear';
    return 'badge-neutral';
  }

  function bullBearClass(value) {
    if (value === 'Bullish') return 'badge-bull';
    if (value === 'Bearish') return 'badge-bear';
    return null;
  }

  // Flags a CBC badge whose LIVE/still-forming reading has already diverged from the last
  // CONFIRMED reading — i.e. it's mid-flip, about to confirm the other way if the HTF/MTF bar
  // closes as it currently stands. Only HTF (15m) and MTF (60m/1H) have a separate live reading at
  // all (LTF is the chart's own bar, always "confirmed" the instant it closes, so CBC3 never gets
  // a ring). Colored by the LIVE direction, not the confirmed one — e.g. confirmed still reads
  // Bearish (red fill) but live has already flipped Bullish -> green ring around the red badge.
  function liveDivergenceRing(confirmedVal, liveVal) {
    if (!confirmedVal || !liveVal || confirmedVal === liveVal) return null;
    if (liveVal === 'Bullish') return 'badge-ring-bull';
    if (liveVal === 'Bearish') return 'badge-ring-bear';
    return null;
  }

  // Builds the single-line badge strip: CONFIRMED/UNCONFIRMED, then CBC3/15/60, then ST3/15/60, then
  // EMA3/15/60 — each timeframe badge is only included if that field was actually present in this
  // alert's body (fields can be toggled off in the Pine script, or MTF/HTF can be disabled entirely).
  function buildBadgeRow(rows, headlineLines) {
    const get = (label) => {
      const r = rows.find(([k]) => k === label);
      return r ? r[1] : null;
    };
    const bulletLines = headlineLines.filter(l => l.startsWith('•'));
    const isUnconfirmed = /UNCONFIRMED|early\/unconfirmed/i.test(bulletLines.join(' '));
    const statusBadge = bulletLines.length
      ? `<span class="badge ${isUnconfirmed ? 'badge-unconfirmed' : 'badge-confirmed'}">${isUnconfirmed ? 'UNCONFIRMED' : 'CONFIRMED'}</span>`
      : '';

    const cbc = [
      ['CBC3', bullBearClass(get('CBC (3m)')), null],
      ['CBC15', bullBearClass(get('CBC (15m)')), liveDivergenceRing(get('CBC (15m)'), get('CBC (15m, live/unconfirmed)'))],
      ['CBC60', bullBearClass(get('CBC (1H)')), liveDivergenceRing(get('CBC (1H)'), get('CBC (1H, live/unconfirmed)'))],
    ].filter(([, cls]) => cls);

    const st = [
      ['ST3', structureDirClass(get('Structure (3m)'))],
      ['ST15', structureDirClass(get('Structure (15m)'))],
      ['ST60', structureDirClass(get('Structure (1H)'))],
    ].filter(([, cls]) => cls);

    const ema = [
      ['EMA3', bullBearClass(get('EMA cloud (3m)'))],
      ['EMA15', bullBearClass(get('EMA cloud (15m)'))],
      ['EMA60', bullBearClass(get('EMA cloud (1H)'))],
    ].filter(([, cls]) => cls);

    // ENTRY badge: flags that this alert carries a "look for entry" moment — an Entry Zone
    // (either naming), a suggested Entry price, or a Suggested stop. Colored by the zone's
    // LONG/SHORT direction when available (the newer "Entry Zone" naming carries it); falls back
    // to a neutral gray badge when only the older Buy Zone naming or a bare Entry/stop line is
    // present, since there's no direction field to color it by in that case.
    const hasEntryInfo = get('Entry Zone High') || get('Entry Zone Low') || get('Buy Zone High') || get('Buy Zone Low') || get('Entry') || get('Suggested stop');
    const entryDir = get('Entry Zone');
    const entry = hasEntryInfo
      ? [['ENTRY', entryDir === 'LONG' ? 'badge-bull' : entryDir === 'SHORT' ? 'badge-bear' : 'badge-neutral']]
      : [];

    const groups = [cbc, st, ema, entry].filter(g => g.length);
    const groupsHtml = groups.map(g => g.map(([label, cls, ring]) => `<span class="badge ${cls}${ring ? ' ' + ring : ''}">${label}</span>`).join('')).join('<span class="badge-divider">|</span>');

    if (!statusBadge && !groupsHtml) return '';
    return `<div class="badge-row">${statusBadge}${statusBadge && groupsHtml ? '<span class="badge-divider">|</span>' : ''}${groupsHtml}</div>`;
  }

  // Which type-filter title(s) apply to a given alert. Falls back to OTHER_TYPE for alerts that
  // don't match any known type (foreign alerts, or a bullet-point wording that's changed since).
  function getAlertTypeTitles(headlineLines) {
    const matches = getDefinitionsForHeadline(headlineLines).map(d => d.title);
    return matches.length ? matches : [OTHER_TYPE];
  }



  // ---- Alert Types filter panel wiring ----
  const typeFilterBtn = document.getElementById('typeFilterBtn');
  const typeFilterPanel = document.getElementById('typeFilterPanel');

  function renderTypeFilterPanel() {
    const rowsHtml = ALL_TYPE_TITLES.map((title, i) => {
      const checked = enabledTypes.has(title) ? 'checked' : '';
      return `<label class="type-filter-row"><input type="checkbox" data-type-title="${encodeURIComponent(title)}" ${checked}> ${escapeHtml(title)}</label>`;
    }).join('');
    typeFilterPanel.innerHTML = rowsHtml + `<div class="type-filter-actions">
      <button type="button" id="typeFilterAll">All</button>
      <button type="button" id="typeFilterNone">None</button>
    </div>`;
  }
  renderTypeFilterPanel();

  // Positions the panel with fixed coords clamped to the viewport, instead of trusting CSS
  // right:0 (which anchors to the button's own position — fine on desktop where the button
  // sits at the far right of a single-row header, but on mobile the header wraps and the
  // button can land left-of-center, pushing a right-anchored 260px panel off the left edge
  // of the screen entirely, with no way to scroll to the clipped checkboxes).
  function positionTypeFilterPanel() {
    const margin = 8;
    const rect = typeFilterBtn.getBoundingClientRect();
    const panelWidth = typeFilterPanel.offsetWidth || 260;
    let left = rect.right - panelWidth; // default: align panel's right edge under the button
    left = Math.min(left, window.innerWidth - margin - panelWidth); // don't overflow right
    left = Math.max(left, margin); // don't overflow left
    let top = rect.bottom + 6;
    top = Math.min(top, window.innerHeight - margin - 40); // keep panel from starting off-bottom
    typeFilterPanel.style.left = left + 'px';
    typeFilterPanel.style.top = top + 'px';
  }
  window.addEventListener('resize', () => {
    if (typeFilterPanel.classList.contains('open')) positionTypeFilterPanel();
  });

  typeFilterBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const opening = !typeFilterPanel.classList.contains('open');
    typeFilterPanel.classList.toggle('open');
    if (opening) positionTypeFilterPanel();
  });
  document.addEventListener('click', (e) => {
    if (!typeFilterPanel.contains(e.target) && e.target !== typeFilterBtn) {
      typeFilterPanel.classList.remove('open');
    }
  });
  typeFilterPanel.addEventListener('click', (e) => {
    if (e.target.id === 'typeFilterAll') {
      ALL_TYPE_TITLES.forEach(t => enabledTypes.add(t));
      renderTypeFilterPanel();
      render();
      return;
    }
    if (e.target.id === 'typeFilterNone') {
      enabledTypes.clear();
      renderTypeFilterPanel();
      render();
      return;
    }
    if (e.target.matches('input[data-type-title]')) {
      const title = decodeURIComponent(e.target.dataset.typeTitle);
      if (e.target.checked) enabledTypes.add(title);
      else enabledTypes.delete(title);
      render();
    }
  });

  function timeAgo(iso) {
    const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  }

  function classify(text) {
    const t = text.toUpperCase();
    if (t.includes('LONG') || t.includes('BULLISH')) return 'bull';
    if (t.includes('SHORT') || t.includes('BEARISH')) return 'bear';
    return '';
  }

  // Per-row coloring, mirroring the on-chart Status table's logic: bullish/LONG green, bearish/SHORT
  // red, session-colored for the Market row, plain otherwise (Time, Chart, ORB set, EMA comparison
  // lines, etc. don't get a bull/bear read so they stay neutral).
  function classifyRow(key, value) {
    const k = key.toUpperCase();
    const v = value.toUpperCase();
    if (k === 'MARKET') {
      if (v.includes('NEW YORK')) return 'ny';
      if (v.includes('LONDON')) return 'london';
      if (v.includes('ASIAN')) return 'asian';
      return 'neutral';
    }
    if (k.startsWith('STRUCTURE')) {
      // Matches the Pine script's v3.22 rule: green only for a full bullish structure (Higher
      // High AND Higher Low), red only for a full bearish structure (Lower High AND Lower Low).
      // Mixed readings (HH/LL, LH/HL) stay neutral.
      if (v.replace(/\s/g, '') === 'HH/HL') return 'bull';
      if (v.replace(/\s/g, '') === 'LH/LL') return 'bear';
      return 'neutral';
    }
    // "3min - Above Both" / "15min - Below Both" / etc. — the direction lives in the LABEL here,
    // not the value (the value is just the raw EMA9/EMA20/price ordering text).
    if (/^\d+min - /i.test(key)) {
      if (k.includes('ABOVE BOTH')) return 'bull';
      if (k.includes('BELOW BOTH')) return 'bear';
      return 'neutral';
    }
    if (v.includes('BULLISH') || v.startsWith('LONG') || v.includes(' LONG ')) return 'bull';
    if (v.includes('BEARISH') || v.startsWith('SHORT') || v.includes(' SHORT ')) return 'bear';
    if (v.startsWith('ABOVE')) return 'bull';
    if (v.startsWith('BELOW')) return 'bear';
    return 'neutral';
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Converts the "Chart" field's timeframe text (e.g. "3m", "15m", "1H", "4H", "1D") into
  // TradingView's chart URL "interval" format (minutes as a plain number, or D/W/M for daily+).
  function tfToInterval(tf) {
    if (!tf) return null;
    let m = tf.match(/^(\d+)\s*m$/i);
    if (m) return m[1];
    m = tf.match(/^(\d+)\s*h$/i);
    if (m) return String(parseInt(m[1], 10) * 60);
    m = tf.match(/^(\d+)\s*d$/i);
    if (m) return m[1] === '1' ? 'D' : m[1] + 'D';
    m = tf.match(/^(\d+)\s*w$/i);
    if (m) return m[1] === '1' ? 'W' : m[1] + 'W';
    return null;
  }

  // Builds a TradingView chart link from the alert's ticker + "Chart" field, if present. TradingView
  // chart URLs are universal links — on a phone with the TradingView app installed, this hands off to
  // the app automatically; otherwise it opens the web chart in whatever browser you're logged into.
  function buildChartUrl(tickerOnly, rows) {
    if (!tickerOnly) return null;
    const chartField = rows.find(([k]) => k === 'Chart');
    let tf = null;
    if (chartField) {
      const parts = chartField[1].trim().split(/\s+/);
      tf = parts[parts.length - 1]; // "MES1!  3m" -> "3m"
    }
    const interval = tfToInterval(tf);
    let url = 'https://www.tradingview.com/chart/?symbol=' + encodeURIComponent(tickerOnly);
    if (interval) url += '&interval=' + encodeURIComponent(interval);
    return url;
  }

  // "CBC (3m) last flip" etc. normally read like "LONG 7/22 18:51 ET  #1" — too long to fit 3 per
  // row. Drops the date (keeps time) since these are grouped side by side: "LONG 18:51 #1".
  function shortenLastFlip(key, value) {
    if (!key.includes('last flip')) return value;
    const m = value.match(/^(LONG|SHORT)\s+\d{1,2}\/\d{1,2}\s+(\d{1,2}:\d{2})\s+ET\s+(#\d+)/i);
    return m ? `${m[1]} ${m[2]} ${m[3]}` : value;
  }

  // Arranges [key, value] pairs into rows per ROW_GROUPS: each configured group becomes one row
  // (in the order fields are found — a group with a missing field just renders fewer chips that
  // row), and anything left over becomes its own single-field row, in original order.
  function groupRows(rows) {
    const used = new Array(rows.length).fill(false);
    const groupedRows = [];
    ROW_GROUPS.forEach(matchers => {
      const found = [];
      matchers.forEach(prefix => {
        const idx = rows.findIndex((r, i) => !used[i] && r[0].startsWith(prefix));
        if (idx !== -1) {
          used[idx] = true;
          found.push(rows[idx]);
        }
      });
      if (found.length) groupedRows.push(found);
    });
    rows.forEach((r, i) => {
      if (!used[i]) groupedRows.push([r]);
    });
    return groupedRows;
  }

  function render() {
    // Populate the symbol filter dropdown from whatever tickers have shown up so far, preserving
    // the current selection (and falling back to "all" if the selected symbol has since rolled off).
    const symbols = Array.from(new Set(alerts.map(a => getSymbol(a.raw)).filter(Boolean))).sort();
    const prevValue = symbolFilterEl.value || activeFilter;
    symbolFilterEl.innerHTML = '<option value="all">All symbols</option>' +
      symbols.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
    symbolFilterEl.value = symbols.includes(prevValue) ? prevValue : 'all';
    activeFilter = symbolFilterEl.value;

    const bySymbol = activeFilter === 'all' ? alerts : alerts.filter(a => getSymbol(a.raw) === activeFilter);
    const filtered = bySymbol.filter(a => {
      const lines = (a.raw || '').split('\n').map(l => l.trim()).filter(l => l.length > 0);
      const headlineLines = lines.filter((l, i) => i === 0 || l.startsWith('•'));
      const types = getAlertTypeTitles(headlineLines);
      // AND logic: a merged alert (e.g. "HTF CBC Flip - Early" + "LTF + HTF Agreement - Early"
      // fired together) only shows while EVERY type it contains is checked. Unchecking any one
      // type immediately hides every alert that includes that condition, even if bundled with
      // other still-enabled types. (Previously used .some(), which only hid an alert once ALL
      // of its bundled types were unchecked — so unchecking a single type on a multi-condition
      // alert appeared to do nothing.)
      return types.every(t => enabledTypes.has(t));
    });

    countEl.textContent = activeFilter === 'all' ? alerts.length : `${filtered.length} of ${alerts.length}`;
    emptyEl.style.display = filtered.length ? 'none' : 'block';
    listEl.innerHTML = filtered.map(a => {
      const body = a.raw || '';
      const lines = body.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      const headlineLines = [];
      const rows = [];
      lines.forEach((line, i) => {
        if (i === 0 || line.startsWith('•')) {
          headlineLines.push(line);
          return;
        }
        const idx = line.indexOf(': ');
        if (idx === -1) return; // skip lines that aren't "Key: Value" (shouldn't be many)
        const key = line.slice(0, idx);
        if (HIDDEN_FIELDS.some(prefix => key.startsWith(prefix))) return;
        rows.push([key, line.slice(idx + 2)]);
      });

      // Fallback for alerts that don't match MapleStax's structured format at all (no parseable
      // "Key: Value" fields found) — e.g. alerts from a completely different indicator/source hitting
      // the same webhook. Render as plain text instead of forcing it into the colored table layout.
      if (rows.length === 0) {
        const plainSummary = lines[0] || '(empty alert)';
        const isExpandedPlain = expandedIds.has(a.id);
        return `<div class="card ${isExpandedPlain ? 'expanded' : ''}" data-id="${a.id}">
          <div class="card-top" data-toggle="${a.id}">
            <div class="card-top-left">
              <span class="chevron">&#9656;</span>
              <span class="card-summary">${escapeHtml(plainSummary)}</span>
            </div>
            <div style="display:flex; align-items:baseline; gap:10px; flex-shrink:0;">
              <span class="card-time">${new Date(a.receivedAt).toLocaleString()}</span>
              <span class="card-ago" data-ts="${a.receivedAt}">${timeAgo(a.receivedAt)}</span>
            </div>
          </div>
          <div class="card-headline"><span class="headline-text" style="color:var(--text); white-space:pre-wrap;">${escapeHtml(lines.join('\n'))}</span></div>
        </div>`;
      }

      // Pull the configured highlight fields up into the headline banner itself, with Bullish/Bearish
      // words colored so direction pops out at a glance.
      const highlightLines = buildHeadlineHighlights(rows);
      const headlineTextHtml = colorizeBullBear(headlineLines.join('\n'));
      const headlineHtml = headlineTextHtml + (highlightLines.length ? '\n' + highlightLines.join('\n') : '');

      const bodyRows = rows.filter(([k]) => !FIELDS_SHOWN_ONLY_IN_HEADLINE.some(prefix => k.startsWith(prefix)));
      const bodyHtml = groupRows(bodyRows).map(group => {
        const fieldsHtml = group.map(([k, v]) => {
          const displayV = shortenLastFlip(k, v);
          const cls = classifyRow(k, v);
          return `<div class="field ${cls}"><span class="k">${escapeHtml(k)}</span><span class="v">${escapeHtml(displayV)}</span></div>`;
        }).join('');
        return `<div class="row-group">${fieldsHtml}</div>`;
      }).join('');

      // One-line summary shown in the collapsed header: the ticker plus the first bullet (the main
      // headline), so you can tell alerts apart before expanding any of them.
      const tickerOnly = (lines[0] || '').replace(/[—\s]+$/, '');
      const summaryText = [tickerOnly, (headlineLines[1] || '').replace(/^•\s*/, '')].filter(Boolean).join(' — ');
      const isExpanded = expandedIds.has(a.id);
      const chartUrl = buildChartUrl(tickerOnly, rows);
      const statusClass = classifyAlertStatus(headlineLines);
      const typePill = classifyTypePill(headlineLines);
      const typePillHtml = typePill ? `<span class="type-pill ${typePill.cls}">${typePill.label}</span>` : '';
      const badgeRowHtml = buildBadgeRow(rows, headlineLines);

      return `<div class="card ${statusClass} ${isExpanded ? 'expanded' : ''}" data-id="${a.id}">
        <div class="card-top" data-toggle="${a.id}">
          <div class="card-top-left">
            <span class="chevron">&#9656;</span>
            ${typePillHtml}
            <span class="card-summary">${escapeHtml(summaryText)}</span>
          </div>
          <div style="display:flex; align-items:baseline; gap:10px; flex-shrink:0;">
            ${chartUrl ? `<a class="chart-link" href="${chartUrl}" target="_blank" rel="noopener" title="Open chart in TradingView" onclick="event.stopPropagation()">&#128200;</a>` : ''}
            <span class="card-time">${new Date(a.receivedAt).toLocaleString()}</span>
            <span class="card-ago" data-ts="${a.receivedAt}">${timeAgo(a.receivedAt)}</span>
          </div>
        </div>
        ${badgeRowHtml}
        ${headlineLines.length ? `<div class="card-headline"><span class="headline-text">${headlineHtml}</span><span class="info-icon" data-headline="${encodeURIComponent(headlineLines.join('\n'))}">i</span></div>` : ''}
        <div class="field-body">${bodyHtml}</div>
      </div>`;
    }).join('');
  }

  function tickAgo() {
    document.querySelectorAll('.card-ago').forEach(el => {
      el.textContent = timeAgo(el.dataset.ts);
    });
  }
  setInterval(tickAgo, 15000);

  // Event delegation: card headers are recreated on every render() call (new alert arriving etc.),
  // so listen on the shared container instead of attaching a listener per card.
  listEl.addEventListener('click', (e) => {
    const headline = e.target.closest('.info-icon');
    if (headline) {
      const lines = decodeURIComponent(headline.dataset.headline).split('\n');
      showDefinitions(lines);
      return;
    }
    const header = e.target.closest('[data-toggle]');
    if (!header) return;
    const id = header.dataset.toggle;
    const card = header.closest('.card');
    if (expandedIds.has(id)) {
      expandedIds.delete(id);
      card.classList.remove('expanded');
    } else {
      expandedIds.add(id);
      card.classList.add('expanded');
    }
  });

  const defModal = document.getElementById('defModal');
  const defModalBox = document.getElementById('defModalBox');

  function showDefinitions(headlineLines) {
    const defs = getDefinitionsForHeadline(headlineLines);
    const content = defs.length
      ? defs.map(d => `<h3>${escapeHtml(d.title)}</h3><p>${escapeHtml(d.def)}</p>`).join('')
      : '<p class="none">No matching alert-type definition found for this headline.</p>';
    defModalBox.innerHTML = content + '<button class="modal-close" id="defModalCloseBtn">Close</button>';
    defModal.classList.add('open');
    document.getElementById('defModalCloseBtn').addEventListener('click', () => defModal.classList.remove('open'));
  }

  defModal.addEventListener('click', (e) => {
    if (e.target === defModal) defModal.classList.remove('open');
  });

  function flashPulse() {
    pulseEl.classList.add('live');
    setTimeout(() => pulseEl.classList.remove('live'), 1500);
  }

  // Initial load
  fetch('/alerts').then(r => r.json()).then(data => {
    alerts = data;
    render();
  });

  // Live stream
  const es = new EventSource('/stream');
  es.onopen = () => { connEl.textContent = 'live'; };
  es.onerror = () => { connEl.textContent = 'reconnecting…'; };
  es.onmessage = (e) => {
    const alert = JSON.parse(e.data);
    alerts.unshift(alert);
    render();
    flashPulse();
  };

  downloadBtn.addEventListener('click', () => {
    const toExport = activeFilter === 'all' ? alerts : alerts.filter(a => getSymbol(a.raw) === activeFilter);
    if (!toExport.length) { alert('No alerts to download.'); return; }
    const blob = new Blob([JSON.stringify(toExport, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().replace(/[:.]/g, '-');
    const label = activeFilter === 'all' ? 'all' : activeFilter.replace(/[^a-zA-Z0-9]/g, '');
    a.href = url;
    a.download = `alerts-${label}-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  clearBtn.addEventListener('click', () => {
    if (!confirm('Clear all stored alerts?')) return;
    const token = prompt('Enter your webhook token to confirm (leave blank if you did not set one):') || '';
    fetch('/clear?token=' + encodeURIComponent(token), { method: 'POST' }).then(r => {
      if (r.ok) { alerts = []; render(); }
      else alert('Could not clear (check token).');
    });
  });
</script>

</body>
</html>
