<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alert Feed</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b0e14'/%3E%3Cpath d='M55 15 L30 55 L48 55 L42 85 L72 45 L52 45 Z' fill='%23f5a623'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #0b0e14;
    --panel: #12161f;
    --panel-border: #1f2530;
    --text: #e5e9f0;
    --muted: #6b7280;
    --accent: #f5a623;
    --bull: #22c55e;
    --bear: #ef4444;
    --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px 20px;
    padding: 14px 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--panel-border);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .brand b { color: var(--text); }
  .pulse {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .pulse.live {
    background: var(--bull);
    box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6);
    animation: ping 1.8s ease-out infinite;
  }
  @keyframes ping {
    0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.55); }
    70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
    100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
  }
  .stats {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    display: flex;
    gap: 18px;
  }
  .stats strong { color: var(--accent); font-weight: 600; }
  .actions button {
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--muted);
    font-family: var(--sans);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  .actions button:hover { color: var(--text); border-color: var(--muted); }

  .view-tabs {
    display: flex;
    gap: 2px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 2px;
  }
  .view-tab-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 5px;
    cursor: pointer;
  }
  .view-tab-btn:hover { color: var(--text); }
  .view-tab-btn.active {
    background: var(--accent);
    color: #1a1400;
    font-weight: 600;
  }

  .symbol-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }
  .symbol-tab-btn {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 0.02em;
  }
  .symbol-tab-btn:hover { color: var(--text); border-color: var(--muted); }
  .symbol-tab-btn.active {
    background: var(--accent);
    color: #1a1400;
    border-color: var(--accent);
  }
  .symbol-tab-count {
    margin-left: 7px;
    opacity: 0.65;
    font-weight: 400;
  }
  .symbol-tab-btn.active .symbol-tab-count { opacity: 0.75; }

  .tier-label {
    cursor: pointer;
    user-select: none;
  }
  .tier-label:hover { opacity: 0.85; }
  .tier-chevron {
    display: inline-block;
    margin-right: 6px;
    transition: transform 0.15s ease;
    font-size: 10px;
  }
  .tier-cards.collapsed { display: none; }
  .tier-label.collapsed .tier-chevron { transform: rotate(-90deg); }

  .faq-toolbar { margin-bottom: 16px; }
  #faqSearch {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 8px;
  }
  #faqSearch:focus { outline: none; border-color: var(--accent); }
  .faq-item {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 12px;
  }
  .faq-q {
    color: var(--accent);
    font-weight: 700;
    font-size: 14px;
    margin: 0 0 10px 0;
  }
  .faq-a {
    color: var(--text);
    font-size: 13.5px;
    line-height: 1.6;
  }
  .faq-a p { margin: 0 0 10px 0; }
  .faq-a ul { margin: 4px 0 10px 20px; padding: 0; }
  .faq-a li { margin-bottom: 4px; }
  .faq-a strong { color: var(--text); }
  .faq-a .faq-rule {
    background: rgba(245, 166, 35, 0.08);
    border-left: 3px solid var(--accent);
    padding: 10px 14px;
    border-radius: 0 6px 6px 0;
    margin-top: 12px;
  }
  .faq-empty { color: var(--muted); font-size: 13px; padding: 20px; text-align: center; }

  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 20px;
  }
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 14px;
  }
  .empty .big { font-size: 28px; margin-bottom: 10px; color: var(--panel-border); }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 14px;
    animation: slidein 0.25s ease-out;
  }
  /* Status border colors: A+ Setup alerts get blue, confirmed alerts get green, and
     early/unconfirmed alerts get yellow — matches how these are eyeballed on the chart. */
  .card.status-aplus { border: 2px solid #22d3ee; }
  .card.status-confirmed { border: 2px solid #22c55e; }
  .card.status-unconfirmed { border: 2px solid #fde047; }
  .card.status-fail { border: 2px solid #ef4444; }
  @keyframes slidein {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 14px;
    background: #060810;
    cursor: pointer;
    user-select: none;
    gap: 10px;
  }
  .card-top:hover { background: #0c0f18; }
  .card-top-left {
    display: flex;
    align-items: baseline;
    gap: 10px;
    min-width: 0;
  }
  .chevron {
    display: inline-block;
    color: var(--muted);
    font-size: 11px;
    transition: transform 0.15s ease;
    flex-shrink: 0;
  }
  .card.expanded .chevron { transform: rotate(90deg); color: var(--accent); }
  .symbol-cockpit { margin-bottom: 20px; }
  .symbol-cockpit-header {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    padding: 6px 4px;
    border-bottom: 2px solid var(--border);
    margin-bottom: 8px;
  }
  .tier-section { margin-bottom: 10px; }
  .tier-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.5px;
    padding: 3px 8px;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  .tier-count { opacity: 0.75; }
  .tier-truncated-note {
    color: var(--muted);
    font-family: var(--sans);
    font-size: 12px;
    padding: 10px 4px 4px;
    font-style: italic;
  }
  .tier-actionable .tier-label { background: #341010; color: #e6a3a3; }
  .tier-forming .tier-label { background: #854f0b; color: #faeeda; }
  .tier-context .tier-label { background: #1c2028; color: #7a7d87; }
  .card-summary {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    flex: 1 1 auto;
  }
  .card-time {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
  }
  .card-ago {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }
  .chart-link {
    text-decoration: none;
    font-size: 14px;
    opacity: 0.7;
  }
  .chart-link:hover { opacity: 1; }
  .card-headline,
  .field-body {
    display: none;
  }
  .card.expanded .card-headline {
    display: block;
  }
  .card.expanded .field-body {
    display: block;
  }
  .card-headline {
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.5;
    padding: 10px 14px;
    background: #1a1300;
    color: var(--accent);
    border-bottom: 1px solid var(--panel-border);
    white-space: pre-wrap;
    word-break: break-word;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .headline-text { flex: 1 1 auto; }
  .info-icon {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: rgba(245,166,35,0.25);
    color: var(--accent);
    font-size: 11px;
    font-weight: 700;
    font-family: var(--sans);
    cursor: help;
    user-select: none;
  }
  .info-icon:hover { background: rgba(245,166,35,0.45); }
  .hl-bull { color: #4ade80; font-weight: 700; }
  .hl-white { color: #ffffff; font-weight: 700; }
  .hl-bear { color: #f87171; font-weight: 700; }

  /* Type pill (FLIP / AGREEMENT / EMA ZONE / A+) sits inline in the headline row, next to the info icon. */
  .type-pill {
    flex-shrink: 0;
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 9999px;
    white-space: nowrap;
  }
  .type-pill.pill-flip-long,
  .type-pill.pill-agreement-long,
  .type-pill.pill-emazone-long,
  .type-pill.pill-orbsuccess { background: #3b6d11; color: #eaf3de; }
  .type-pill.pill-flip-short,
  .type-pill.pill-agreement-short,
  .type-pill.pill-emazone-short { background: #a32d2d; color: #fcebeb; }
  .type-pill.pill-aplus { background: #185fa5; color: #e6f1fb; }
  .type-pill.pill-luxalgo-bull { background: #2d6b4f; color: #dff3e8; border: 1px solid #6d4fa3; }
  .type-pill.pill-luxalgo-bear { background: #6b2d3d; color: #f3dfe4; border: 1px solid #6d4fa3; }
  .type-pill.pill-neutral { background: #444441; color: #d3d1c7; }
  .type-pill.pill-orbfail { background: #a32d2d; color: #fcebeb; }

  /* Single-line badge strip: CONFIRMED/UNCONFIRMED, then CBC3/15/60, then ST3/15/60, then EMA3/15/60 —
     always visible (even collapsed), unlike .card-headline/.field-body below which stay expand-only. */
  .badge-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    font-family: var(--mono);
    padding: 8px 14px;
    border-bottom: 1px solid var(--panel-border);
  }
  .badge-row .badge {
    font-size: 10px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 9999px;
    white-space: nowrap;
  }
  .badge-row .badge-divider {
    color: var(--panel-border);
    font-size: 11px;
  }
  .badge.badge-confirmed { background: #3b6d11; color: #eaf3de; }
  .badge.badge-price { background: #ffffff; color: #000000; }
  .badge.badge-sl { background: #14532d; color: #dcfce7; }
  .badge.badge-unconfirmed { background: #854f0b; color: #faeeda; }
  .badge.badge-bull { background: #3b6d11; color: #F1F5F9; }
  .badge.badge-bear { background: #a32d2d; color: #F1F5F9; }
  .badge.badge-neutral { background: #444441; color: #d3d1c7; }
  /* Ring around a CBC badge whose LIVE/still-forming reading has diverged from the last CONFIRMED
     reading — i.e. it's mid-flip. Ring color is the LIVE direction, independent of the badge's own
     fill (which stays the CONFIRMED direction) — e.g. a red CBC15 badge with a green ring means
     "last confirmed bar was Bearish, but the live/still-forming bar is already reading Bullish". */
  .badge.badge-ring-bull { box-shadow: 0 0 0 2px #4ade80; }
  .badge.badge-ring-bear { box-shadow: 0 0 0 2px #f87171; }

  /* Colors-off ("plain mode"): neutralizes every colored row/badge/highlight in the app. */
  body.plain-mode .field.bull,
  body.plain-mode .field.bear,
  body.plain-mode .field.ny,
  body.plain-mode .field.london,
  body.plain-mode .field.asian {
    background: #0e1219 !important;
  }
  body.plain-mode .field.bull .v,
  body.plain-mode .field.bear .v,
  body.plain-mode .field.ny .v,
  body.plain-mode .field.london .v,
  body.plain-mode .field.asian .v {
    color: var(--text) !important;
  }
  body.plain-mode .hl-bull,
  body.plain-mode .hl-bear {
    color: inherit !important;
    font-weight: inherit !important;
  }
  body.plain-mode .badge,
  body.plain-mode .type-pill {
    background: #262b33 !important;
    color: var(--text) !important;
    box-shadow: none !important;
  }
  body.plain-mode .card.status-aplus,
  body.plain-mode .card.status-confirmed,
  body.plain-mode .card.status-unconfirmed,
  body.plain-mode .card.status-fail {
    border-color: var(--panel-border) !important;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    max-width: 480px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    padding: 18px 20px;
    font-family: var(--sans);
  }
  .modal-box h3 {
    margin: 0 0 4px;
    font-family: var(--mono);
    font-size: 14px;
    color: var(--accent);
  }
  .modal-box p {
    margin: 6px 0 16px;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--text);
  }
  .modal-box .none {
    color: var(--muted);
    font-size: 13px;
  }
  .modal-close {
    display: block;
    margin: 8px auto 0;
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--muted);
    padding: 6px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-family: var(--sans);
    font-size: 12.5px;
  }
  .modal-close:hover { color: var(--text); border-color: var(--muted); }
  .section-label {
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 10px 12px 4px;
    background: var(--panel);
  }
  .row-group {
    display: flex;
    flex-wrap: wrap;
    border-top: 2px solid #ffffff;
  }
  .row-group:last-child { border-bottom: 2px solid #ffffff; }
  .field {
    flex: 1 1 0;
    min-width: 90px;
    border-right: 2px solid #ffffff;
    padding: 7px 12px;
    font-family: var(--mono);
    font-size: 12.5px;
  }
  .field:last-child { border-right: none; }
  .field .k {
    display: block;
    color: #cbd5e1;
    font-size: 10.5px;
    margin-bottom: 2px;
  }
  .field .v {
    display: block;
    font-weight: 600;
    word-break: break-word;
  }
  .field.bull { background: rgba(34,197,94,0.28); }
  .field.bull .v { color: #bbf7d0; }
  .field.bear { background: rgba(239,68,68,0.28); }
  .field.bear .v { color: #fecaca; }
  .field.neutral { background: #0e1219; }
  .field.ny { background: #ff9800; }
  .field.ny .v { color: #3d1e00; }
  .field.london { background: #9c27b0; }
  .field.london .v { color: #fff; }
  .field.asian { background: #e65100; }
  .field.asian .v { color: #fff; }

  /* Phones: smaller text, chips can drop to a bit narrower before wrapping. */
  @media (max-width: 560px) {
    main { padding: 12px; }
    .card-top { flex-direction: column; align-items: flex-start; gap: 4px; }
    .card-top-left { width: 100%; }
    .card-summary { max-width: 100%; }
    .field { min-width: 78px; font-size: 11.5px; padding: 6px 9px; }
    .field .k { font-size: 9.5px; }
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    row-gap: 8px;
  }
  .tier-limit-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tier-limit-label {
    color: var(--muted);
    font-family: var(--sans);
    font-size: 12px;
    white-space: nowrap;
  }
  #tierLimitSelect {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  #tierLimitSelect:focus { outline: 1px solid var(--accent); }
  .type-filter-wrap { position: relative; }
  #typeFilterBtn {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  #typeFilterBtn:hover { border-color: var(--muted); }
  .type-filter-panel {
    display: none;
    /* position is set inline via JS (positionTypeFilterPanel) as position:fixed, clamped to
       the viewport — CSS top/right below are just an unused fallback in case JS hasn't run yet. */
    position: fixed;
    top: 0;
    right: 0;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 10px;
    width: 260px;
    max-width: calc(100vw - 16px);
    max-height: 60vh;
    overflow-y: auto;
    z-index: 50;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .type-filter-panel.open { display: block; }
  .type-filter-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 2px;
    font-family: var(--sans);
    font-size: 12.5px;
    color: var(--text);
    cursor: pointer;
  }
  .type-filter-row input { flex-shrink: 0; }
  .type-filter-master { font-weight: 600; border-top: 1px solid var(--panel-border); margin-top: 4px; padding-top: 8px; }
  .type-filter-indent { padding-left: 18px; font-size: 11.5px; color: var(--muted); }
  .type-filter-divider {
    border-top: 1px solid var(--panel-border);
    margin: 6px 0;
  }
  .type-filter-actions {
    display: flex;
    justify-content: space-between;
    padding-top: 6px;
    margin-top: 6px;
    border-top: 1px solid var(--panel-border);
  }
  .type-filter-actions button {
    background: transparent;
    border: none;
    color: var(--accent);
    font-size: 11.5px;
    cursor: pointer;
    padding: 2px 4px;
  }
  .ext-links {
    display: flex;
    gap: 14px;
    font-family: var(--mono);
    font-size: 12px;
  }
  .ext-links a {
    color: var(--muted);
    text-decoration: none;
  }
  .ext-links a:hover { color: var(--accent); }

  footer {
    text-align: center;
    padding: 30px 20px 50px;
    color: var(--panel-border);
    font-family: var(--mono);
    font-size: 11px;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="pulse" id="pulse"></span>
    <span>Alert Feed <b id="conn">connecting…</b></span>
  </div>
  <div class="stats">
    <span><strong id="count">0</strong> received</span>
  </div>
  <div class="ext-links">
    <a href="https://www.forexfactory.com/" target="_blank" rel="noopener">forex</a>
    <a href="https://www.financialjuice.com/home" target="_blank" rel="noopener">News</a>
  </div>
  <div class="actions">
    <div class="view-tabs" id="viewTabs">
      <button class="view-tab-btn active" id="tabAlertsBtn" data-view="alerts">Alerts</button>
      <button class="view-tab-btn" id="tabFaqBtn" data-view="faq">FAQ</button>
    </div>

<script>

  const entryZoneToggleBtn = document.getElementById('entryZoneToggleBtn');

  // Chronological view: per symbol, show every filtered alert as one flat time-ordered list instead
  // of grouping into the Actionable/Forming/Context accordion. Skips tier classification entirely —

  //
  // Two-tiered "View" dropdown: top level picks Tiered vs Chronological; when Chronological is

  const viewModeBtn = document.getElementById('viewModeBtn');
  const viewModePanel = document.getElementById('viewModePanel');
  let chronoView = localStorage.getItem('chronoView') === 'true'; // default false (Tiered)
  let chronoSymbolFilter;
  try {
    const saved = JSON.parse(localStorage.getItem('chronoSymbolFilter') || 'null');
    chronoSymbolFilter = new Set(Array.isArray(saved) ? saved : null);

  let chronoSymbolFilterInitialized = chronoSymbolFilter.size > 0 || localStorage.getItem('chronoSymbolFilter') !== null;
  function saveChronoSymbolFilter() {

  }
  function currentKnownSymbols() {

  }
  function renderViewModePanel() {

    // First time we ever see the symbol list (nothing saved yet), default to "all selected".
    if (!chronoSymbolFilterInitialized && symbols.length) {
      symbols.forEach(s => chronoSymbolFilter.add(s));
      chronoSymbolFilterInitialized = true;
      saveChronoSymbolFilter();
    }
    const modeRowHtml = `<label class="type-filter-row"><input type="radio" name="viewModeRadio" data-mode="tiered" ${!chronoView ? 'checked' : ''}> Tiered</label>` +

    let symbolRowsHtml = '';
    if (chronoView) {

  // ---------------------------------------------------------------------

  const FAQ_ITEMS = [
    {
      q: "What is the recommended workflow for trading NQ/MNQ with CBC?",

        <p style="margin-top:10px;">Experienced traders often add one more layer: they only trade in the direction of the higher-timeframe trend and use the voice alerts as a second set of eyes while journaling or managing multiple charts.</p>
        <p style="margin-top:10px;"><strong>Does this apply beyond NQ/MNQ?</strong> Yes — the CBC methodology is symbol-agnostic. The same HTF/LTF alignment + confluence approach works on MES, MGC, and other liquid futures; just watch for round-number levels appropriate to that instrument (e.g. $50/$100 increments on gold vs. 100-point "Bill Breaker" levels on NQ).</p>
        <p style="margin-top:10px;"><strong>Why 15-minute HTF instead of 10-minute?</strong> The script's own "Auto" HTF setting already defaults to a 15-minute HTF whenever the chart timeframe is 5 minutes or less (and 3-minute HTF otherwise) — so using a 15m HTF with a 3m LTF chart matches the script's built-in default with no manual override needed.</p>
        <p style="margin-top:10px;"><strong>Does the Pine script actually implement these alerts?</strong> Yes. It includes dedicated toggles for LTF CBC Flip, HTF CBC Flip, LTF+HTF Agreement (confirmed and early/unconfirmed), A+ Setup (HTF CBC + both EMA clouds + VWAP side + pre-ORB-breakout), VWAP Break, EMA9/20 Cross, ORB Break, and ORB Retest/Break-&-Base — plus a separate Level Proximity alert covering VWAP, round numbers ("Bill Breakers"), YDH/YDL, and ORB High/Low. The BRSG Zone, EMA Cloud, and CBC flip-level dashes described above are all built into the indicator as well.</p>

  const faqListEl = document.getElementById('faqList');

    const q = (filterText || '').trim().toLowerCase();
    const items = FAQ_ITEMS.filter(item =>
      !q || item.q.toLowerCase().includes(q) || item.a.toLowerCase().includes(q)
    );

      faqListEl.innerHTML = '<div class="faq-empty">No FAQ items match your search.</div>';

    faqListEl.innerHTML = items.map(item => `
      <div class="faq-item">
        <div class="faq-q">${item.q}</div>

  // here so a manual expand isn't immediately re-collapsed on the next render() call (e.g. a new
  // alert arriving). Once a key has been seen once, its state is entirely up to collapsedTiers.
  const seenTierKeys = new Set();

  const tierLimitEl = document.getElementById('tierLimitSelect');
  tierLimitEl.value = localStorage.getItem('tierLimit') || '25';
  tierLimitEl.addEventListener('change', () => {

  const formingWindowEl = document.getElementById('formingWindowSelect');
  formingWindowEl.value = localStorage.getItem('formingWindow') || '5';
  formingWindowEl.addEventListener('change', () => {

  // Extracts the ticker from an alert's raw text (its first line, e.g. "MES1! —" -> "MES1!").
  // CBC Wire messages (a separate companion script — see parseCbcWireAlert below) didn't carry a
  // symbol at all before v0.67; older messages fall back to a generic "CBC Wire" filter bucket so
  // they at least don't pollute the dropdown with garbage (the whole raw string as a "symbol").
  function getSymbol(raw) {
    const wireAlert = parseCbcWireAlert(raw);
    if (wireAlert) return wireAlert.symbol || 'CBC Wire';
    const firstLine = (raw || '').split('\n')[0] || '';
    // "TICKER — rest of message" on ONE line (this script's own alerts have nothing after the dash,
    // but a third-party alert can legitimately have the ticker and the signal on the same line) —
    // extract just the ticker part, not the whole line, or every uniquely-worded message would
    // create its own bogus one-off "symbol" instead of grouping under the real ticker.
    const tickerMatch = firstLine.match(/^([^\s—]+)\s*—/);
    if (tickerMatch) return tickerMatch[1].trim();
    return firstLine.replace(/[—\s]+$/, '').trim();
  }

  // CBC Wire is a separate companion Pine script (not MapleStax CBC) that fires compact
  // pipe-delimited alerts instead of the "Key: Value" format this dashboard was built to parse —
  // e.g. "LEVEL|BB_ABOVE|approaching|7500|7498|below|62e4769d|0.66|15". Returns null for anything
  // that isn't one of CBC Wire's 4 known channels, so normal MapleStax parsing proceeds untouched.
  function humanizeCbcWireLevelName(name) {
    if (name === 'VWAP') return 'VWAP';
    if (name === 'BB_ABOVE' || name === 'BB_BELOW') return 'Bill Breaker';
    if (name === 'YDH') return 'YDH';
    if (name === 'YDL') return 'YDL';
    const emaM = name.match(/^EMA(20|200)_/);
    if (emaM) return 'EMA ' + emaM[1];
    const pivotM = name.match(/^PIVOT_(HIGH|LOW)_/);
    if (pivotM) return 'Pivot ' + (pivotM[1] === 'HIGH' ? 'High' : 'Low');
    return name;
  }

  // Detects whether a LEVEL message's first field is a known level name (old format, no ticker)
  // or something else (new v0.67+ format, ticker inserted there instead).
  function isKnownCbcWireLevelName(s) {
    return s === 'VWAP' || s === 'YDH' || s === 'YDL' || s === 'ORH' || s === 'ORL' ||
      /^BB_(ABOVE|BELOW)$/.test(s) || /^EMA(20|200)_/.test(s) || /^PIVOT_(HIGH|LOW)_/.test(s);
  }

  function parseCbcWireAlert(raw) {
    const text = (raw || '').trim();
    const parts = text.split('|');
    const channel = parts[0];
    if (!['LEVEL', 'CBC', 'EMA', 'HEARTBEAT', 'STARTUP'].includes(channel)) return null;

    if (channel === 'LEVEL') {
      // v0.67+ inserts the ticker right after "LEVEL|" — detect by checking whether that field
      // is a recognized level name (old format, no ticker) or something else (new format).
      const hasTicker = !isKnownCbcWireLevelName(parts[1]);
      const o = hasTicker ? 1 : 0;
      const symbol = hasTicker ? parts[1] : null;
      const [name, phase, levelVal, price, direction] = [parts[1 + o], parts[2 + o], parts[3 + o], parts[4 + o], parts[5 + o]];
      const tf = parts[8 + o]; // last field
      const dist = Math.abs(parseFloat(price) - parseFloat(levelVal)).toFixed(2);
      const humanName = humanizeCbcWireLevelName(name);
      const levelLabel = (name === 'BB_ABOVE' || name === 'BB_BELOW') ? `${humanName} ${levelVal}` : humanName;
      const phaseWord = phase === 'crossing' ? 'Crossing' : 'Approaching';
      return {
        symbol, tf, isBull: direction === 'above',
        summary: `${phaseWord} ${levelLabel}`,
        detail: `Price ${price} is ${dist} points ${direction} ${humanName} (${levelVal})`,
      };
    }
    if (channel === 'CBC' || channel === 'EMA') {
      // v0.67+ inserts ticker right after the channel name — old tf_label is always plain
      // digits, so a non-numeric field here means it's the new ticker-first format.
      const hasTicker = !/^\d+$/.test(parts[1]);
      const o = hasTicker ? 1 : 0;
      const symbol = hasTicker ? parts[1] : null;
      const tf = parts[1 + o], dir = parts[2 + o], price = parts[3 + o];
      const label = channel === 'CBC' ? 'CBC Flip' : 'EMA9/20 Cross';
      return {
        symbol, tf, isBull: dir === 'bullish',
        summary: `${label}: ${dir === 'bullish' ? 'Bullish' : 'Bearish'}`,
        detail: `Price ${price}`,
      };
    }
    if (channel === 'HEARTBEAT') {
      const hasTicker = !/^\d+$/.test(parts[1]);
      const o = hasTicker ? 1 : 0;
      const symbol = hasTicker ? parts[1] : null;
      const tf = parts[1 + o];
      let detail = 'No signal this bar';
      if (parts[4 + o] === 'LEVEL') {
        const [name, phase, levelVal, price] = [parts[5 + o], parts[6 + o], parts[7 + o], parts[8 + o]];
        detail = `Nearby: ${phase} ${humanizeCbcWireLevelName(name)} (${levelVal}), price ${price}`;
      }
      return { symbol, tf, isBull: null, summary: 'Heartbeat', detail };
    }
    // STARTUP|[<ticker>|]<tf>|<userId>|<version>
    const hasTicker = !/^\d+$/.test(parts[1]);
    const o = hasTicker ? 1 : 0;
    const symbol = hasTicker ? parts[1] : null;
    const tf = parts[1 + o];
    const version = parts[3 + o];
    return { symbol, tf, isBull: null, summary: 'Connected', detail: `Timeframe ${tf}m discovered (CBC Wire v${version})` };
  }

  // ---------------------------------------------------------------------
  // ROW GROUPING — edit this to control exactly which fields share a row.
  // Each inner array = one row, listing 1-3 (or more) field labels that should
  // sit side by side. Matching is by PREFIX (so "CBC (15m" also matches
  // "CBC (15m, live/unconfirmed)"). Order here also sets the display order.
  // Anything from an alert that ISN'T listed below just falls back to its
  // own full-width row, in the order it appeared — so new/unlisted fields
  // never get silently dropped, they just aren't grouped.
  // ---------------------------------------------------------------------
  const ROW_GROUPS = [
    ['Time', 'Market'],
    ['Chart', 'Price'],
    ['Opening range', 'ORB set'],
    ['VWAP', 'EMA 200'],
    ['EMA9/20 (3)', 'EMA9/20 (15)'],
    ['CBC (3m) last flip', 'CBC (15m) last flip', 'CBC (1H) last flip', 'CBC (60) last flip'],
    ['Pivot R1', 'Pivot R2', 'Pivot R3'],
    ['Pivot S1', 'Pivot S2', 'Pivot S3'],
    ['3min - ', '15min - ', '60min - '],
  ];

  // Fields whose label starts with any of these are dropped entirely from the dashboard — not
  // grouped, not shown standalone, just skipped. Edit this list to hide/unhide fields.
  const HIDDEN_FIELDS = ['Prev Candle', 'HTF Candle'];

  // Fields that are hidden from the raw field-body table specifically because they're now shown
  // as compact badges instead (same badges as the always-visible strip above) — CBC/Structure/EMA
  // cloud direction readings, plus the live/unconfirmed CBC variants (now reflected by the ring
  // around the CBC15/CBC60 badge instead of their own row). EXACT match, not prefix — "CBC (3m)"
  // is a prefix of "CBC (3m) last flip" too, which must stay a full text row, not get swallowed.
  const FIELDS_SHOWN_ONLY_AS_BADGES = [
    'CBC (3m)', 'CBC (15m)', 'CBC (1H)', 'CBC (60)',
    'CBC (15m, live/unconfirmed)', 'CBC (1H, live/unconfirmed)', 'CBC (60, live/unconfirmed)',
    'Structure (3m)', 'Structure (15m)', 'Structure (1H)', 'Structure (60)',
    'EMA cloud (3m)', 'EMA cloud (15m)', 'EMA cloud (1H)', 'EMA cloud (60)',
    'CBC Flip Level (3m)', 'CBC Flip Level (15m)', 'CBC Flip Level (1H)', 'CBC Flip Level (60)',
    'CBC (3m) last flip', 'CBC (15m) last flip', 'CBC (1H) last flip', 'CBC (60) last flip',
    'Price', 'Opening range', 'VWAP', 'EMA 200', 'HTF Trailing Stop',
  ];

  // Fields that are hidden from the raw field-body table specifically because
  // buildHeadlineHighlights already folds them into a compact headline line — unlike
  // HIDDEN_FIELDS above, these must stay in `rows` (that's what buildHeadlineHighlights reads),
  // they're just excluded when building the field-body rows further down.
  const FIELDS_SHOWN_ONLY_IN_HEADLINE = [
    'Entry Zone High', 'Entry Zone Low', 'Entry Zone',
    'Buy Zone High', 'Buy Zone Low',
    'Entry', 'Suggested stop',
  ];

  // Builds the extra lines appended into the headline banner, below the bullet points. Edit this
  // function to change which fields combine onto which line, or the separator between them.
  function buildHeadlineHighlights(rows) {
    const get = (label) => {
      const r = rows.find(([k]) => k === label);
      return r ? r[1] : null;
    };
    const lines = [];

    // Structure (15m)/(MTF) and EMA cloud (15m)/(MTF) used to optionally show here, but now that
    // the ST3/ST15/ST60 badges spell out the actual value (e.g. "15-LH/HL") instead of just a
    // generic label, and EMA15/EMA60 already show bull/bear via color, this would be pure
    // duplication — so it was removed rather than kept behind a toggle.

    // Support both the current "Entry Zone High/Low" naming and the older pre-rename "Buy Zone
    // High/Low" naming some live alerts still send, so this compacts either way.
    if (showEntryZone) {
      const buyHigh = get('Entry Zone High') || get('Buy Zone High');
      const buyLow = get('Entry Zone Low') || get('Buy Zone Low');
      const zoneDir = get('Entry Zone'); // "LONG" or "SHORT" — only present on the newer naming
      if (buyHigh || buyLow) {
        const priceStr = get('Price');
        const priceNum = parseFloat(priceStr);
        const lowNum = parseFloat(buyLow);
        const highNum = parseFloat(buyHigh);
        const inZone = !isNaN(priceNum) && !isNaN(lowNum) && !isNaN(highNum) && priceNum >= lowNum && priceNum <= highNum;
        const priceLabel = inZone ? 'Enter Price' : 'Price';
        const buyText = `Entry BRSG Zone: ${buyLow || '—'} to ${buyHigh || '—'}  (${priceLabel}: ${priceStr || '—'})`;
        const dirClass = zoneDir === 'LONG' ? 'hl-bull' : zoneDir === 'SHORT' ? 'hl-bear' : null;
        lines.push(dirClass ? `<span class="${dirClass}">${escapeHtml(buyText)}</span>` : escapeHtml(buyText));
      }
    }

    // The suggested entry price (A+ Setup / ORB Retest) and stop (EMA9/20 Zone entries) — same
    // "look for entry" moment as the zone above, so it's folded onto its own compact line rather
    // than left as a separate full-width field-body row.
    const entryLine = get('Entry');
    const stopLine = get('Suggested stop');
    if (entryLine || stopLine) {
      const parts = [
        entryLine ? `Entry: ${entryLine}` : '',
        stopLine ? `Stop: ${stopLine}` : '',
      ].filter(Boolean).join('   ');
      lines.push(escapeHtml(parts).replace(/(look for (?:LTF|HTF|MTF) EMA20: [\d.]+)/gi, '<span class="hl-white">$1</span>'));
    }

    return lines;
  }

  // Escapes text, then colors "Bullish"/"LONG"/"HH / HL" green and "Bearish"/"SHORT"/"LH / LL" red
  // — used only for the headline highlight lines, so key directional words pop out at a glance.
  // Mixed structure readings (HH/LL, LH/HL) are left uncolored, matching the table's own rule.
  function colorizeBullBear(text) {
    return escapeHtml(text)
      .replace(/\b(Bullish|LONG)\b/g, '<span class="hl-bull">$1</span>')
      .replace(/\b(Bearish|SHORT)\b/g, '<span class="hl-bear">$1</span>')
      .replace(/\bHH\s*\/\s*HL\b/g, '<span class="hl-bull">HH / HL</span>')
      .replace(/\bLH\s*\/\s*LL\b/g, '<span class="hl-bear">LH / LL</span>')
      .replace(/\b(confirmed)\b/gi, '<span class="hl-bull">$1</span>');
  }

  // ---------------------------------------------------------------------
  // ALERT TYPE DEFINITIONS — same text as the (i) tooltips next to each alert
  // checkbox in the Pine script's Alerts settings group. Checked in order,
  // first match per headline bullet line wins. Update this if the script's
  // own tooltips change, to keep them in sync.
  // ---------------------------------------------------------------------
  const ALERT_TYPE_DEFS = [
    {
      test: (l) => /VWAP (Crossing|Approaching):/i.test(l),
      title: 'VWAP Proximity (Bullish/Bearish)',
      def: 'Fires once when price crosses (within the configured Crossing distance) or approaches (within the configured Approaching distance) VWAP. Fires once per "visit" — won\'t repeat every bar while price stays in the same band.'
    },
    {
      test: (l) => /EMA (20|200) (Crossing|Approaching):/i.test(l),
      title: 'EMA Proximity (Bullish/Bearish)',
      def: 'Fires once when price crosses or approaches EMA 20 or EMA 200 (chart timeframe). Fires once per "visit" — won\'t repeat every bar while price stays in the same band.'
    },
    {
      test: (l) => /Bill Breaker \d/i.test(l),
      title: 'Bill Breaker Proximity (Bullish/Bearish)',
      def: 'Fires once when price crosses or approaches the nearest 100-point round-number level above/below price. Fires once per "visit" per specific round number — approaching 2900 and later approaching 3000 are treated as separate events.'
    },
    {
      test: (l) => /\b(Crossing|Approaching):\s*(Bullish|Bearish)/i.test(l),
      title: 'Level Proximity (Pivot/YDH/YDL/ORB)',
      def: 'Fires once when price crosses (within the configured Crossing distance) or approaches (within the configured Approaching distance, but farther than Crossing) a 1-bar-lookback swing pivot (crossing only), Yesterday\'s High/Low, or the current session\'s Opening Range High/Low. A crossing on any level always beats an approaching on any level. Fires once per "visit" — won\'t repeat every bar while price stays in the same band.'
    },
    {
      test: (l) => /Price Enters HTF EMA9\/20 Zone/i.test(l),
      title: 'Price Enters HTF EMA9/20 Zone - Entry',
      def: 'Fires once when: the CONFIRMED HTF direction is bullish (or bearish), AND price just entered the zone BETWEEN the HTF\'s own EMA9 and EMA20 (having been outside it the prior bar) — a pullback into the HTF\'s own moving-average zone during an already-established trend, worth watching for an entry. Message includes a suggested stop-loss at the HTF\'s own EMA20 level.'
    },
    {
      test: (l) => /A\+ Setup/i.test(l),
      title: 'A+ Setup (Long/Short)',
      def: 'Fires once when: (1) confirmed HTF CBC direction, (2) chart-timeframe EMA cloud, and (3) HTF EMA cloud all align in the same direction, (4) price is already CONFIRMED on the trade\'s side of VWAP (above VWAP for Long, below VWAP for Short), AND (5) price is still ANTICIPATORY on the Opening Range — hasn\'t broken the ORB high (Long) / ORB low (Short) yet, i.e. before that breakout confirms.'
    },
    {
      test: (l) => /VWAP Bounce/i.test(l),
      title: 'VWAP Bounce - High R:R (Long/Short)',
      def: 'Fires once when a CBC flip happens right at VWAP while price is clear of the nearest major support/resistance level (Pivot Points PP/R1/R2/R3/S1/S2/S3, or the current session\'s ORB high/low) by at least a minimum distance — nothing structural nearby to cap the move, so reward is high relative to risk. Minimum distance is auto by symbol root (MES/MGC=6, M2K=4, MNQ=60, other=6), overridable in Settings.'
    },
    {
      test: (l) => /LTF EMA20 Touch/i.test(l),
      title: 'EMA20 Touch - Pullback Entry (LTF)',
      def: 'Fires when price touches the chart\'s own (LTF) EMA20 on a REGRESSIVE candle — moving down into the touch during a confirmed uptrend, or up into it during a confirmed downtrend — i.e. CBC confirms the trend continuing, not the regression itself.'
    },
    {
      test: (l) => /HTF EMA20 Touch/i.test(l),
      title: 'EMA20 Touch - Pullback Entry (HTF)',
      def: 'Same idea as the LTF version, but checked against the HTF\'s own EMA20 and confirmed by the HTF\'s own CBC direction instead of the chart timeframe\'s.'
    },
    {
      test: (l) => /HTF Pullback Entry - Structure Confirmed/i.test(l),
      title: 'HTF Pullback Entry - Structure Confirmed (Long/Short)',
      def: 'Fires once when ALL of: (1) HTF CBC flipped within a recent-bars window, (2) price pulled back INTO the HTF\'s own EMA9/20 zone, and (3) HTF market structure confirms — HH/HL for Long, LH/LL for Short. Message includes a risk reference (the prior HTF candle\'s low for Long, high for Short).'
    },
    {
      test: (l) => /ORB Retest Fail/i.test(l),
      title: 'ORB Retest Fail (Long/Short)',
      def: 'Fires once when an ORB Retest / Break & Base setup fails: price broke out beyond the ORB high (Long) or low (Short), then fully round-tripped through the OPPOSITE side of the range before ever confirming the base — invalidating the setup. The other outcome of the same setup as "ORB Retest / Break & Base" below, gated by the same alert toggle.'
    },
    {
      test: (l) => /ORB Retest/i.test(l),
      title: 'ORB Retest / Break & Base (Long/Short)',
      def: 'Fires once on the classic ORB playbook: (1) price already closed outside the session\'s Opening Range (the initial breakout), (2) price pulled back and retested the broken level from the other side, and (3) a bar then closed back in the breakout direction, confirming the level flipped from resistance to support (Long) or support to resistance (Short). Only fires within the configured "Max bars to wait for retest" of the original breakout.'
    },
    {
      test: (l) => /Outside HTF ORB/i.test(l),
      title: 'Outside HTF ORB (Bullish/Bearish)',
      def: 'Fires once when price closes outside the current session\'s Opening Range — above the ORB high (Bullish) or below the ORB low (Bearish). Uses whichever session\'s OR is currently active (Asian/London/New York).'
    },
    {
      test: (l) => /VWAP Break/i.test(l),
      title: 'VWAP Break (Bullish/Bearish)',
      def: 'Fires once when price closes on the opposite side of VWAP from where it was the prior bar (a VWAP cross), either direction.'
    },
    {
      test: (l) => /EMA 200 Break/i.test(l),
      title: 'EMA 200 Break (Bullish/Bearish)',
      def: 'Fires once when price closes on the opposite side of EMA 200 from where it was the prior bar (an EMA200 cross), either direction.'
    },
    {
      test: (l) => /EMA9\/20 Cross/i.test(l),
      title: 'EMA9/20 Cross (Bullish/Bearish)',
      def: 'Fires once when the chart-timeframe EMA9 crosses EMA20, either direction — the crossing MOMENT, distinct from the EMA cloud direction already in every alert (which just reports whichever state currently holds, not when it changed).'
    },
    {
      test: (l) => /Key Level Alert:/i.test(l),
      title: 'Key Level Alert (PP/R1/R2/R3/S1/S2/S3)',
      def: 'Fires once per level the instant price closes on the opposite side of that Daily Standard Pivot Point level from where it was the prior bar. PP/R1/S1 always checked; R2/S2 and R3/S3 only if those tiers are enabled in the Pivot Points input group. More than one level CAN legitimately fire on the same bar, unlike Level Proximity above.'
    },
    {
      test: (l) => /MapleStax CBC Started/i.test(l),
      title: 'Startup / Connected',
      def: 'Fires exactly once, the moment the script enters real-time mode — confirms the connection is live without waiting for any other condition to trigger first. Not gated by the alert session-window toggles.'
    },
    {
      test: (l) => /Agreement/i.test(l) && /early\/unconfirmed/i.test(l),
      title: 'LTF + HTF Agreement - Early (unconfirmed HTF)',
      def: 'Fires once, as soon as the chart timeframe agrees with the HTF\'s LIVE, still-forming state — before that HTF bar closes, tagged UNCONFIRMED. If the live HTF state reverses before its bar closes, no confirmed alert follows — you only got the early heads-up. If it holds, a confirmed "LTF + HTF Agreement" alert fires automatically once that HTF bar closes.'
    },
    {
      // Distinguishes a CONFIRMED Agreement bullet that fires purely because the LTF just caught up
      // to an HTF that did NOT change on this bar (bullet is worded "LTF(...) ... + HTF(...) Agreement",
      // no "HTF CBC Flip" prefix) from a genuine HTF-side flip, which is worded "HTF(...) CBC Flip +
      // LTF(...) Agreement" and still falls through to the type below, staying visible by default.
      test: (l) => /^•\s*LTF\(/i.test(l) && /Agreement/i.test(l),
      title: 'LTF + HTF Agreement - LTF Joined Unchanged HTF',
      def: 'Fires when the chart timeframe flips to join an HTF direction that did NOT change on this bar — the HTF was already sitting there; only the LTF caught up. Distinct from a genuine HTF-side flip, which fires as the separate "LTF + HTF Agreement (Long/Short)" combined bullet (worded "HTF(...) CBC Flip + LTF(...) Agreement") regardless of this toggle. Off by default since this case is usually not new information.'
    },
    {
      test: (l) => /Agreement/i.test(l),
      title: 'LTF + HTF Agreement (Long/Short)',
      def: 'Fires the moment the chart timeframe and the CONFIRMED (last closed) HTF bar both agree — both Long or both Short — i.e. entering agreement, not repeated every bar while still in agreement.'
    },
    {
      test: (l) => /HTF\(/i.test(l) && /CBC Flip/i.test(l) && /(UNCONFIRMED|still forming)/i.test(l),
      title: 'HTF CBC Flip - Early (unconfirmed, still forming)',
      def: 'Fires once, as soon as the HTF\'s LIVE, still-forming state would flip — before that HTF bar closes, tagged UNCONFIRMED. If the live HTF state reverses before its bar closes, no confirmed alert follows. If it holds, a confirmed "HTF CBC Flip" alert fires automatically once that HTF bar closes.'
    },
    {
      test: (l) => /HTF\(/i.test(l) && /CBC Flip/i.test(l),
      title: 'HTF CBC Flip (Long/Short)',
      def: 'Fires once the HTF bar has fully CLOSED and its CBC flipped (last closed HTF bar only). Confirmed — won\'t fire on a signal that reverses before that HTF bar closes.'
    },
    {
      test: (l) => /LTF\(/i.test(l) && /CBC Flip/i.test(l) && /(UNCONFIRMED|mid-candle)/i.test(l),
      title: 'LTF CBC Flip - Early (unconfirmed, mid-candle)',
      def: 'Fires once, as soon as the LIVE still-forming candle would trigger a flip — before the bar closes, tagged UNCONFIRMED. If price reverses before close, no confirmed alert follows. If it holds, a confirmed "LTF CBC Flip" alert fires automatically at that bar\'s actual close.'
    },
    {
      test: (l) => /LTF\(/i.test(l) && /CBC Flip/i.test(l),
      title: 'LTF CBC Flip (Long/Short)',
      def: 'Fires once the bar has fully CLOSED and the chart-timeframe CBC flipped. Confirmed — won\'t fire on a signal that reverses before close.'
    },
  ];

  // LuxAlgo Price Action Concepts — a separate third-party indicator on the same webhook, not this
  // script. Generated compactly (loops, not 26 hand-written objects) to keep this small. Structure
  // family (Internal/Swing x Bullish/Bearish x BOS/CHOCH/CHOCH+) wording is confirmed for CHOCH+ and
  // one BOS direction; the rest of this family and the OB/Breaker/Within group are LuxAlgo's standard
  // naming pattern, inferred rather than sample-confirmed — tighten the regex if a real message differs.
  ['Internal', 'Swing'].forEach(level => ['Bullish', 'Bearish'].forEach(dir => ['BOS', 'CHOCH', 'CHOCH\\+'].forEach(kind => {
    const plain = kind.replace('\\+', '+');
    ALERT_TYPE_DEFS.push({
      test: (l) => new RegExp(`${level}\\s+${dir}\\s+${kind}\\s+formed`, 'i').test(l),
      title: `Price Action - ${level} ${dir} ${plain}`,
      def: `LuxAlgo Price Action Concepts: ${dir} ${plain.startsWith('BOS') ? 'Break of Structure' : 'Change of Character'} on ${level.toLowerCase()} structure.`
    });
  })));
  // Confirmed real wording for OB Created is spelled out ("Bullish order block created"), NOT the
  // abbreviated "OB Created" — matching both forms since OB Mitigated/Entered/Breaker wording is
  // still unconfirmed and could go either way.
  ['Liquidity Grab', 'OB Created', 'OB Mitigated', 'Breaker', 'OB Entered'].forEach(suffix => ['Bullish', 'Bearish'].forEach(dir => {
    const spelledOut = suffix.replace('OB ', 'order block ');
    const pattern = suffix === spelledOut ? suffix : `(?:${suffix}|${spelledOut})`;
    ALERT_TYPE_DEFS.push({
      test: (l) => new RegExp(`${dir}\\s+${pattern}`, 'i').test(l),
      title: `Price Action - ${dir} ${suffix}`,
      def: `LuxAlgo Price Action Concepts: ${dir} ${suffix}.`
    });
  }));
  ['Bullish', 'Bearish'].forEach(dir => ALERT_TYPE_DEFS.push({
    test: (l) => new RegExp(`Within\\s+${dir}\\s+OB`, 'i').test(l),
    title: `Price Action - Within ${dir} OB`,
    def: `LuxAlgo Price Action Concepts: price currently trading inside an active ${dir.toLowerCase()} Order Block.`
  }));
  ['Highs', 'Lows'].forEach(hl => ALERT_TYPE_DEFS.push({
    test: (l) => new RegExp(`Equal\\s+${hl}`, 'i').test(l),
    title: `Price Action - Equal ${hl}`,
    def: `LuxAlgo Price Action Concepts: two or more swing ${hl.toLowerCase()} formed at nearly the same price.`
  }));
  const PRICE_ACTION_PREFIX = 'Price Action - ';

  // Most of our own alerts have "• " bulleted signal lines with line 0 just being the ticker/date
  // header. But a non-bulleted alert (e.g. LuxAlgo's plain one-line "Internal Bearish BOS formed",
  // with no bullet at all) would have ZERO bullet lines — filtering to bulletLines alone would
  // silently make every classifier below treat it as having no content. This falls back to treating
  // line 0 as "the line" only when there are truly no bullets, so bulleted alerts are unaffected.
  function getEffectiveLines(headlineLines) {
    const bulletLines = headlineLines.filter(l => l.startsWith('•'));
    return bulletLines.length ? bulletLines : headlineLines;
  }

  function getDefinitionsForHeadline(headlineLines) {
    const bulletLines = getEffectiveLines(headlineLines);
    const seen = new Set();
    const results = [];
    bulletLines.forEach(line => {
      const match = ALERT_TYPE_DEFS.find(d => d.test(line));
      if (match && !seen.has(match.title)) {
        seen.add(match.title);
        results.push(match);
      }
    });
    return results;
  }

  const OTHER_TYPE = 'Other (unrecognized)';
  const ALL_TYPE_TITLES = ALERT_TYPE_DEFS.map(d => d.title).concat([OTHER_TYPE]);
  // VWAP/EMA/Bill Breaker Proximity default OFF — these are the noisiest of the newly-added Level
  // Proximity types (VWAP/EMA20/EMA200/Bill Breakers are common levels price crosses constantly),
  // unlike Pivot/YDH/YDL/ORB proximity which fires far less often and stays on by default.
  const DEFAULT_OFF_TYPES = ['VWAP Proximity (Bullish/Bearish)', 'EMA Proximity (Bullish/Bearish)', 'Bill Breaker Proximity (Bullish/Bearish)', 'LTF + HTF Agreement - LTF Joined Unchanged HTF']
    .concat(ALL_TYPE_TITLES.filter(t => t.startsWith(PRICE_ACTION_PREFIX))); // all 26 Price Action types off by default, per request
  const enabledTypes = new Set(ALL_TYPE_TITLES.filter(t => !DEFAULT_OFF_TYPES.includes(t)));

  // Which categories trigger a VOICE callout — separate selection from the Alert Types display
  // filter above (a type can show in the feed without being read aloud, or vice versa). Persisted
  // as a JSON array (localStorage can't store a Set directly). Defaults to the same starting set as
  // the display filter, since that's a reasonable "everything sensible" starting point either way.
  let voiceEnabledTypes;
  try {
    const saved = JSON.parse(localStorage.getItem('voiceEnabledTypes') || 'null');
    voiceEnabledTypes = new Set(Array.isArray(saved) ? saved.filter(t => ALL_TYPE_TITLES.includes(t)) : Array.from(enabledTypes));
  } catch (e) {
    voiceEnabledTypes = new Set(enabledTypes);
  }
  function saveVoiceEnabledTypes() {
    localStorage.setItem('voiceEnabledTypes', JSON.stringify(Array.from(voiceEnabledTypes)));
  }

  // Card border color: A+ Setup alerts are always confirmed-only (per the Pine script, they
  // only ever fire in the confirmed batch), so they get their own distinct color rather than
  // just falling under "confirmed". ORB Retest Fail is technically a "confirmed" (certain, not
  // early/unconfirmed) outcome too, but it's bad news, not a setup to act on — so it gets its own
  // red border rather than the same green as an actionable confirmed setup. Otherwise: any
  // UNCONFIRMED/early bullet -> yellow border, no such bullet (and at least one bullet at all) ->
  // green border. Alerts with no parseable bullets (the plain-text fallback path) get no status
  // class / default border.
  function classifyAlertStatus(headlineLines) {
    const bulletLines = headlineLines.filter(l => l.startsWith('•'));
    if (!bulletLines.length) return '';
    const joined = bulletLines.join(' ');
    if (/A\+ Setup/i.test(joined)) return 'status-aplus';
    if (/VWAP Bounce/i.test(joined)) return 'status-aplus';
    if (/ORB Retest Fail/i.test(joined)) return 'status-fail';
    if (/UNCONFIRMED|early\/unconfirmed/i.test(joined)) return 'status-unconfirmed';
    return 'status-confirmed';
  }

  // Small colored pill for the headline row: what KIND of setup this is (flip, agreement, EMA
  // zone touch, ORB retest, or A+), colored by the DIRECTION stated in that specific bullet line
  // (long=green, short=red) rather than by confirmation state — the CONFIRMED/UNCONFIRMED oval in
  // the badge row already covers confirmation, so this pill is purely "which way."
  function classifyTypePill(headlineLines) {
    const bulletLines = getEffectiveLines(headlineLines);
    if (!bulletLines.length) return null;
    const joined = bulletLines.join(' ');
    // Direction is read off the SPECIFIC bullet line for this type, not the whole merged alert —
    // a bundled alert can carry multiple bullets (e.g. FLIP + AGREEMENT together), and each one's
    // own LONG/SHORT word is what matters for its own pill. Case-SENSITIVE on purpose: the actual
    // direction token is always true uppercase right after the colon ("...Agreement: LONG (..."),
    // while the parenthetical history note uses lowercase ("...ltf was short, now long") — matching
    // case-insensitively would grab that lowercase word instead of the real direction.
    const lineDirection = (line) => /\bSHORT\b/.test(line) ? 'SHORT' : /\bLONG\b/.test(line) ? 'LONG' : null;

    if (/A\+ Setup/i.test(joined)) return { label: 'A+', cls: 'pill-aplus' };
    if (/VWAP Bounce/i.test(joined)) return { label: 'VWAP BOUNCE', cls: 'pill-aplus' };
    // Covers all 26 LuxAlgo Price Action alert types with one shared regex (BOS/CHOCH formed,
    // Liquidity Grab, Equal Highs/Lows, OB Created/Mitigated/Entered, Breaker, Within OB).
    if (/(BOS|CHOCH\+?)\s+formed|Liquidity Grab|Equal (Highs|Lows)|OB (Created|Mitigated|Entered)|Breaker|Within\s+(Bullish|Bearish)\s+OB/i.test(joined)) {
      const isBear = /Bearish/i.test(joined);
      return { label: 'LUXALGO', cls: isBear ? 'pill-luxalgo-bear' : 'pill-luxalgo-bull' };
    }

    // Level Proximity Alerts: unlike every other pill, the label itself is DYNAMIC — it shows
    // whichever specific level fired (e.g. "EMA 200", "VWAP", "BILL BRK 2900", "YDH"), not a fixed
    // word, since this one alert type covers 7+ different levels. Bullet format is always
    // "<Level> Crossing/Approaching: Bullish/Bearish (...)" — label is everything before that.
    const proxLine = bulletLines.find(l => /\b(Crossing|Approaching):\s*(Bullish|Bearish)/i.test(l));
    if (proxLine) {
      const m = proxLine.match(/^•\s*(.+?)\s+(Crossing|Approaching):\s*(Bullish|Bearish)/i);
      const levelName = m ? m[1].replace(/^Bill Breaker\s+/i, 'BILL BRK ') : 'LEVEL';
      const isBearish = m && m[3].toLowerCase() === 'bearish';
      return { label: levelName.toUpperCase(), cls: isBearish ? 'pill-flip-short' : 'pill-flip-long' };
    }

    const flipLine = bulletLines.find(l => /CBC Flip/i.test(l));
    if (flipLine) {
      return { label: 'FLIP', cls: lineDirection(flipLine) === 'SHORT' ? 'pill-flip-short' : 'pill-flip-long' };
    }

    const agreementLine = bulletLines.find(l => /Agreement/i.test(l));
    if (agreementLine) {
      return { label: 'AGREEMENT', cls: lineDirection(agreementLine) === 'SHORT' ? 'pill-agreement-short' : 'pill-agreement-long' };
    }

    const emaZoneLine = bulletLines.find(l => /EMA9\/20 Zone/i.test(l));
    if (emaZoneLine) {
      return { label: 'EMA ZONE', cls: lineDirection(emaZoneLine) === 'SHORT' ? 'pill-emazone-short' : 'pill-emazone-long' };
    }

    const ema920CrossLine = bulletLines.find(l => /EMA9\/20 Cross/i.test(l));
    if (ema920CrossLine) {
      return { label: 'EMA9/20', cls: /\bBearish\b/.test(ema920CrossLine) ? 'pill-flip-short' : 'pill-flip-long' };
    }

    // Key Level Alert: dynamic label like Level Proximity above — shows which specific level
    // fired (PP/R1/R2/R3/S1/S2/S3), not a fixed word, since one alert type covers all 7.
    const keyLevelLine = bulletLines.find(l => /Key Level Alert:/i.test(l));
    if (keyLevelLine) {
      const m = keyLevelLine.match(/Key Level Alert:\s*(\S+)\s+(Bullish|Bearish)/i);
      const level = m ? m[1].toUpperCase() : 'LEVEL';
      const isBearish = m && m[2].toLowerCase() === 'bearish';
      return { label: level, cls: isBearish ? 'pill-flip-short' : 'pill-flip-long' };
    }

    // Remaining alert types don't have a dedicated color yet — shown as a plain gray pill rather than
    // inventing new colors for them.
    if (/VWAP Break/i.test(joined)) return { label: 'VWAP', cls: 'pill-neutral' };
    if (/EMA 200 Break/i.test(joined)) return { label: 'EMA200', cls: 'pill-neutral' };
    if (/MapleStax CBC Started/i.test(joined)) return { label: 'CONNECTED', cls: 'pill-neutral' };
    // ORB Retest: outside the range and held (success) is green; a failed retest that round-tripped
    // back inside/through the range is red — colored by outcome, not by long/short direction, since
    // "outside vs. back inside" is the meaningful distinction here, not which way it broke.
    if (/ORB Retest Fail/i.test(joined)) return { label: 'ORB FAIL', cls: 'pill-orbfail' };
    if (/ORB Retest/i.test(joined)) return { label: 'ORB RETEST', cls: 'pill-orbsuccess' };
    if (/Outside HTF ORB/i.test(joined)) return { label: 'ORB', cls: 'pill-neutral' };
    return null;
  }

  // Splits a "Structure (Nm)" value like "HH / HL" into its Higher-High/Lower-High and
  // Higher-Low/Lower-Low halves and classifies bull (both High side) / bear (both Low side) /
  // neutral (mixed) — matching the Pine script's own stricter "both sides must agree" coloring rule.
  function structureDirClass(value) {
    if (!value) return null;
    const parts = value.split('/').map(s => s.trim());
    const hi = parts[0], lo = parts[1];
    if (hi === 'HH' && lo === 'HL') return 'badge-bull';
    if (hi === 'LH' && lo === 'LL') return 'badge-bear';
    return 'badge-neutral';
  }

  // Looks up an MTF field (CBC/Structure/EMA cloud) trying every label format the Pine script
  // might actually send. The on-chart Status table displays the MTF timeframe as "1H" via
  // htf_tf_disp(), but the ALERT EMAILS use the raw mtf_timeframe input value directly (e.g.
  // "Structure (" + mtf_timeframe + ")") — which defaults to "60", not "1H". So an alert really
  // contains "Structure (60)", not "Structure (1H)", even though the chart itself shows "1H".
  // Tries "1H" first (in case a custom setup already uses that as the literal input string), then
  // falls back to the "60" default. If the MTF Timeframe input is changed to something else
  // entirely (e.g. "240"), this specific badge will need that value added here too.
  function getMtf(get, prefix) {
    return get(`${prefix} (1H)`) ?? get(`${prefix} (60)`);
  }

  function bullBearClass(value) {
    // startsWith, not exact equality — the Pine script tags the HTF CBC value with a
    // trailing " [A+ SETUP]" specifically on A+ Setup alerts (e.g. "Bullish [A+ SETUP]"
    // instead of plain "Bullish"), which an exact match would silently reject, dropping
    // the CBC15 badge on every A+ alert. startsWith tolerates that suffix (or any other
    // future tag) without breaking the plain case.
    if (!value) return null;
    if (value.startsWith('Bullish')) return 'badge-bull';
    if (value.startsWith('Bearish')) return 'badge-bear';
    return null;
  }

  // Flags a CBC badge whose LIVE/still-forming reading has already diverged from the last
  // CONFIRMED reading — i.e. it's mid-flip, about to confirm the other way if the HTF/MTF bar
  // closes as it currently stands. Only HTF (15m) and MTF (60m/1H) have a separate live reading at
  // all (LTF is the chart's own bar, always "confirmed" the instant it closes, so CBC3 never gets
  // a ring). Colored by the LIVE direction, not the confirmed one — e.g. confirmed still reads
  // Bearish (red fill) but live has already flipped Bullish -> green ring around the red badge.
  function liveDivergenceRing(confirmedVal, liveVal) {
    if (!confirmedVal || !liveVal || confirmedVal === liveVal) return null;
    if (liveVal === 'Bullish') return 'badge-ring-bull';
    if (liveVal === 'Bearish') return 'badge-ring-bear';
    return null;
  }

  // Builds the single-line badge strip: CONFIRMED/UNCONFIRMED, then CBC3/15/60, then ST3/15/60, then
  // EMA3/15/60 — each timeframe badge is only included if that field was actually present in this
  // alert's body (fields can be toggled off in the Pine script, or MTF/HTF can be disabled entirely).
  function buildBadgeRow(rows, headlineLines) {
    const get = (label) => {
      const r = rows.find(([k]) => k === label);
      return r ? r[1] : null;
    };
    const bulletLines = headlineLines.filter(l => l.startsWith('•'));
    const isUnconfirmed = /UNCONFIRMED|early\/unconfirmed/i.test(bulletLines.join(' '));
    const statusBadge = bulletLines.length
      ? `<span class="badge ${isUnconfirmed ? 'badge-unconfirmed' : 'badge-confirmed'}">${isUnconfirmed ? 'UNCONFIRMED' : 'CONFIRMED'}</span>`
      : '';

    const cbc = [
      ['CBC3', bullBearClass(get('CBC (3m)')), null],
      ['CBC15', bullBearClass(get('CBC (15m)')), liveDivergenceRing(get('CBC (15m)'), get('CBC (15m, live/unconfirmed)'))],
      ['CBC60', bullBearClass(getMtf(get, 'CBC')), liveDivergenceRing(getMtf(get, 'CBC'), get('CBC (1H, live/unconfirmed)') ?? get('CBC (60, live/unconfirmed)'))],
    ].filter(([, cls]) => cls);

    // ST badge label spells out the actual reading (e.g. "3-HH/HL") instead of a generic "ST3" —
    // so the badge itself carries the info that used to require the separate headline detail line.
    const stLabel = (num, value) => `${num}-${value.replace(/\s+/g, '')}`;
    const struct3 = get('Structure (3m)');
    const struct15 = get('Structure (15m)');
    const struct60 = getMtf(get, 'Structure');
    const st = [
      [struct3 ? stLabel('3', struct3) : 'ST3', structureDirClass(struct3)],
      [struct15 ? stLabel('15', struct15) : 'ST15', structureDirClass(struct15)],
      [struct60 ? stLabel('60', struct60) : 'ST60', structureDirClass(struct60)],
    ].filter(([, cls]) => cls);

    const ema = [
      ['EMA3', bullBearClass(get('EMA cloud (3m)'))],
      ['EMA15', bullBearClass(get('EMA cloud (15m)'))],
      ['EMA60', bullBearClass(getMtf(get, 'EMA cloud'))],
    ].filter(([, cls]) => cls);

    // EMA9/20 Cross badge — this is a bullet-line SIGNAL ("EMA9/20 Cross: Bullish (crossed above)"),
    // not a "Key: Value" context field, so it's detected from headlineLines directly rather than via
    // get(). Colored bull/bear to match the pill and inline-text highlighting already applied to it.
    const ema920CrossLine = headlineLines.find(l => /EMA9\/20 Cross/i.test(l));
    const ema920Cross = ema920CrossLine
      ? [[/\bBearish\b/i.test(ema920CrossLine) ? 'EMA9/20✕ Bear' : 'EMA9/20✕ Bull', /\bBearish\b/i.test(ema920CrossLine) ? 'badge-bear' : 'badge-bull']]
      : [];

    // ENTRY badge: flags that this alert carries a "look for entry" moment — an Entry Zone
    // (either naming), a suggested Entry price, or a Suggested stop. Colored by the zone's
    // LONG/SHORT direction when available (the newer "Entry Zone" naming carries it); falls back
    // to a neutral gray badge when only the older Buy Zone naming or a bare Entry/stop line is
    // present, since there's no direction field to color it by in that case.
    const hasEntryInfo = get('Entry Zone High') || get('Entry Zone Low') || get('Buy Zone High') || get('Buy Zone Low') || get('Entry') || get('Suggested stop');
    const entryDir = get('Entry Zone');
    const entry = hasEntryInfo
      ? [['ENTRY', entryDir === 'LONG' ? 'badge-bull' : entryDir === 'SHORT' ? 'badge-bear' : 'badge-neutral']]
      : [];

    // OR IN / OR OUT: whether price is currently outside the session's Opening Range (a breakout,
    // green — same visual weight as a bullish/confirmed reading elsewhere) or still inside it
    // (gray/neutral — nothing's happened yet). "Off"/"—"/"Before open"/"Pending" aren't a real
    // in/out state yet, so no badge shows for those.
    // Extracts the trailing "+X.XX"/"-X.XX" style offset already present in these fields' raw
    // values (e.g. "Above range +2.40" -> "+2.40"), so badges can show the number, not just the
    // direction word.
    function extractNum(val) {
      const m = (val || '').match(/([+-]\d+\.?\d*)/);
      return m ? m[1] : '';
    }

    const orValue = get('Opening range');
    const orNum = extractNum(orValue);
    const or = /Above range|Below range/i.test(orValue || '')
      ? [[`OR OUT${orNum ? ' ' + orNum : ''}`, 'badge-bull']]
      : /Inside range/i.test(orValue || '')
        ? [['OR IN', 'badge-neutral']]
        : [];

    // EMA9/20 zone position badges: the "<N>min - Above Both/Below Both/Between" rows show where
    // price sits relative to that timeframe's own EMA9/EMA20 pair — Above Both (green), Below Both
    // (red), or Between them (gray/neutral). The timeframe NUMBER is embedded right in the field's
    // KEY (not a fixed 3/15 — whatever the chart/HTF timeframe actually is, 3m/15m/60m/etc.), so
    // this scans for any row matching that pattern rather than looking up fixed labels.
    const emaZonePhaseClass = (phase) => phase === 'Above Both' ? 'badge-bull' : phase === 'Below Both' ? 'badge-bear' : 'badge-neutral';
    const emaZonePhaseShort = (phase) => phase === 'Above Both' ? 'ABOVE' : phase === 'Below Both' ? 'BELOW' : 'BETWEEN';
    const emazone = rows
      .filter(([k]) => /^\d+min - (Above Both|Below Both|Between)$/.test(k))
      .map(([k]) => {
        const m = k.match(/^(\d+)min - (Above Both|Below Both|Between)$/);
        return [`${m[1]}m ${emaZonePhaseShort(m[2])}`, emaZonePhaseClass(m[2])];
      });

    // Zone-entries-since-flip badges — "EMA9/20 (N) zone entries since flip" rows, where N is
    // whatever the actual LTF/HTF timeframe is (not fixed to 3/15 — scans for any number), compacted
    // to "ENTRY(3)-4" style. Neutral gray since a raw entry count isn't inherently bull or bear.
    const zoneEntries = rows
      .filter(([k]) => /^EMA9\/20 \(\d+\) zone entries since flip$/.test(k))
      .map(([k, v]) => {
        const m = k.match(/^EMA9\/20 \((\d+)\) zone entries since flip$/);
        return [`ENTRY(${m[1]})-${v}`, 'badge-neutral', null, `EMA9/20 zone entries since the last flip, ${m[1]} timeframe`];
      });

    // VWAP / EMA 200 badges — same color rule the field-body table already uses for these rows
    // (classifyRow: value starting with "Above" -> green, "Below" -> red). Numeric offset appended
    // since "VWAP BELOW" alone doesn't say how far below.
    const vwapVal = get('VWAP');
    const vwapNum = extractNum(vwapVal);
    const vwap = /^Above/i.test(vwapVal || '') ? [[`VWAP ABOVE${vwapNum ? ' ' + vwapNum : ''}`, 'badge-bull']] : /^Below/i.test(vwapVal || '') ? [[`VWAP BELOW${vwapNum ? ' ' + vwapNum : ''}`, 'badge-bear']] : [];
    const ema200Val = get('EMA 200');
    const ema200Num = extractNum(ema200Val);
    const ema200 = /^Above/i.test(ema200Val || '') ? [[`EMA200 ABOVE${ema200Num ? ' ' + ema200Num : ''}`, 'badge-bull']] : /^Below/i.test(ema200Val || '') ? [[`EMA200 BELOW${ema200Num ? ' ' + ema200Num : ''}`, 'badge-bear']] : [];

    // HTF SL badge — same value as the "HTF Trailing Stop" row and the on-chart "HTF SL" line,
    // surfaced in the preview too so the stop level is visible without expanding the card.
    const htfStopVal = get('HTF Trailing Stop');
    const htfStopPrice = htfStopVal ? (htfStopVal.match(/^([\d.]+)/) || [])[1] : null;
    const htfSl = htfStopPrice ? [[`HTF SL ${htfStopPrice}`, 'badge-sl']] : [];

    // Pivot R1/PP/S1 preview badges — these used to only be visible after expanding the card into
    // the Context detail table ("Pivot R1: 7824.75" etc.); surfaced here as compact badges too, with
    // a hover tooltip spelling out what each one is, since "R1"/"PP"/"S1" alone isn't self-explanatory.
    const pivR1 = get('Pivot R1');
    const pivPP = get('Pivot PP');
    const pivS1 = get('Pivot S1');
    const pivot = [
      pivR1 ? [`R1 ${pivR1}`, 'badge-bear', null, 'Daily Pivot R1 (first resistance level)'] : null,
      pivPP ? [`PP ${pivPP}`, 'badge-neutral', null, 'Daily Pivot Point (the base level R1/S1 etc. are calculated from)'] : null,
      pivS1 ? [`S1 ${pivS1}`, 'badge-bull', null, 'Daily Pivot S1 (first support level)'] : null,
    ].filter(Boolean);

    // Price badge — the current bar's close, always shown first (orange) so it's visible at a
    // glance without expanding the card, same value as the "Price" row in the field-body table.
    const priceVal = get('Price');
    const price = priceVal ? [[priceVal, 'badge-price']] : [];

    // Candle time-range badge — surfaces the "Time" context row (e.g. "8/5 16:45-16:48 ET", the
    // start-end of the candle this alert refers to) in the preview too, instead of only appearing
    // after expanding into Context.
    const timeVal = get('Time');
    const time = timeVal ? [[timeVal, 'badge-neutral', null, 'The candle this alert refers to (start-end, exchange time)']] : [];

    // Last-flip badges — "CBC (3m) last flip" etc. moved out of the field-body table entirely
    // (now badge-only) since 3 full rows of "LONG 8/1 08:45 ET #2" style text was a lot of space
    // for what's really just "when did this timeframe last flip". Compact to "3-08:45 #2".
    function lastFlipBadge(tf, key) {
      const val = get(key);
      if (!val) return null;
      const m = val.match(/^(LONG|SHORT)\s+\d{1,2}\/\d{1,2}\s+(\d{1,2}:\d{2})\s+ET\s+(#\d+)/i);
      if (!m) return null;
      return [`${tf}-${m[2]} ${m[3]}`, m[1].toUpperCase() === 'SHORT' ? 'badge-bear' : 'badge-bull'];
    }
    const lastFlip = [
      lastFlipBadge('3', 'CBC (3m) last flip'),
      lastFlipBadge('15', 'CBC (15m) last flip'),
      (lastFlipBadge('60', 'CBC (1H) last flip') || lastFlipBadge('60', 'CBC (60) last flip')),
    ].filter(Boolean);

    const groups = [price, time, cbc, st, ema, ema920Cross, emazone, zoneEntries, entry, or, vwap, ema200, lastFlip, htfSl, pivot].filter(g => g.length);
    const groupsHtml = groups.map(g => g.map(([label, cls, ring, title]) => `<span class="badge ${cls}${ring ? ' ' + ring : ''}"${title ? ` title="${escapeHtml(title)}"` : ''}>${label}</span>`).join('')).join('<span class="badge-divider">|</span>');

    if (!statusBadge && !groupsHtml) return '';
    return `<div class="badge-row">${statusBadge}${statusBadge && groupsHtml ? '<span class="badge-divider">|</span>' : ''}${groupsHtml}</div>`;
  }

  // Which type-filter title(s) apply to a given alert. Falls back to OTHER_TYPE for alerts that
  // don't match any known type (foreign alerts, or a bullet-point wording that's changed since).
  function getAlertTypeTitles(headlineLines) {
    const matches = getDefinitionsForHeadline(headlineLines).map(d => d.title);
    return matches.length ? matches : [OTHER_TYPE];
  }



  // ---- Alert Types filter panel wiring ----
  const typeFilterBtn = document.getElementById('typeFilterBtn');
  const typeFilterPanel = document.getElementById('typeFilterPanel');

  function renderTypeFilterPanel() {
    const paTitles = ALL_TYPE_TITLES.filter(t => t.startsWith(PRICE_ACTION_PREFIX));
    const paCheckedCount = paTitles.filter(t => enabledTypes.has(t)).length;
    const nonPaTitles = ALL_TYPE_TITLES.filter(t => !t.startsWith(PRICE_ACTION_PREFIX));
    const rowsHtml = nonPaTitles.map((title) => {
      const checked = enabledTypes.has(title) ? 'checked' : '';
      return `<label class="type-filter-row"><input type="checkbox" data-type-title="${encodeURIComponent(title)}" ${checked}> ${escapeHtml(title)}</label>`;
    }).join('')
      // Master row: checks/unchecks all 26 Price Action types at once; indeterminate when some
      // (not all, not none) are individually enabled, so its visual state always matches reality.
      + `<label class="type-filter-row type-filter-master"><input type="checkbox" id="paMasterCheckbox" ${paCheckedCount === paTitles.length ? 'checked' : ''}> Price Action: All (${paCheckedCount}/${paTitles.length})</label>`
      + paTitles.map((title) => {
        const checked = enabledTypes.has(title) ? 'checked' : '';
        return `<label class="type-filter-row type-filter-indent"><input type="checkbox" data-type-title="${encodeURIComponent(title)}" ${checked}> ${escapeHtml(title.slice(PRICE_ACTION_PREFIX.length))}</label>`;
      }).join('');
    typeFilterPanel.innerHTML = rowsHtml + `<div class="type-filter-actions">
      <button type="button" id="typeFilterAll">All</button>
      <button type="button" id="typeFilterNone">None</button>
    </div>`;
    const masterEl = document.getElementById('paMasterCheckbox');
    if (masterEl) masterEl.indeterminate = paCheckedCount > 0 && paCheckedCount < paTitles.length;
  }
  renderTypeFilterPanel();

  // Voice Categories panel — mirrors the Alert Types panel above (same Price Action master-row
  // pattern), but drives voiceEnabledTypes instead of the display filter enabledTypes.
  const voiceFilterBtn = document.getElementById('voiceFilterBtn');
  const voiceFilterPanel = document.getElementById('voiceFilterPanel');
  function renderVoiceFilterPanel() {
    const paTitles = ALL_TYPE_TITLES.filter(t => t.startsWith(PRICE_ACTION_PREFIX));
    const paCheckedCount = paTitles.filter(t => voiceEnabledTypes.has(t)).length;
    const nonPaTitles = ALL_TYPE_TITLES.filter(t => !t.startsWith(PRICE_ACTION_PREFIX));
    const rowsHtml = nonPaTitles.map((title) => {
      const checked = voiceEnabledTypes.has(title) ? 'checked' : '';
      return `<label class="type-filter-row"><input type="checkbox" data-voice-title="${encodeURIComponent(title)}" ${checked}> ${escapeHtml(title)}</label>`;
    }).join('')
      + `<label class="type-filter-row type-filter-master"><input type="checkbox" id="paMasterVoiceCheckbox" ${paCheckedCount === paTitles.length ? 'checked' : ''}> Price Action: All (${paCheckedCount}/${paTitles.length})</label>`
      + paTitles.map((title) => {
        const checked = voiceEnabledTypes.has(title) ? 'checked' : '';
        return `<label class="type-filter-row type-filter-indent"><input type="checkbox" data-voice-title="${encodeURIComponent(title)}" ${checked}> ${escapeHtml(title.slice(PRICE_ACTION_PREFIX.length))}</label>`;
      }).join('');
    voiceFilterPanel.innerHTML = rowsHtml + `<div class="type-filter-actions">
      <button type="button" id="voiceFilterAll">All</button>
      <button type="button" id="voiceFilterNone">None</button>
    </div>`;
    const masterEl = document.getElementById('paMasterVoiceCheckbox');
    if (masterEl) masterEl.indeterminate = paCheckedCount > 0 && paCheckedCount < paTitles.length;
  }
  renderVoiceFilterPanel();

  function positionVoiceFilterPanel() {
    const margin = 8;
    const rect = voiceFilterBtn.getBoundingClientRect();
    const panelWidth = voiceFilterPanel.offsetWidth || 260;
    let left = rect.right - panelWidth;
    left = Math.min(left, window.innerWidth - margin - panelWidth);
    left = Math.max(left, margin);
    let top = rect.bottom + 6;
    top = Math.min(top, window.innerHeight - margin - 40);
    voiceFilterPanel.style.left = left + 'px';
    voiceFilterPanel.style.top = top + 'px';
  }
  window.addEventListener('resize', () => {
    if (voiceFilterPanel.classList.contains('open')) positionVoiceFilterPanel();
  });
  voiceFilterBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const opening = !voiceFilterPanel.classList.contains('open');
    voiceFilterPanel.classList.toggle('open');
    if (opening) positionVoiceFilterPanel();
  });
  document.addEventListener('click', (e) => {
    if (!voiceFilterPanel.contains(e.target) && e.target !== voiceFilterBtn) {
      voiceFilterPanel.classList.remove('open');
    }
  });
  voiceFilterPanel.addEventListener('click', (e) => {
    if (e.target.id === 'voiceFilterAll') {
      ALL_TYPE_TITLES.forEach(t => voiceEnabledTypes.add(t));
      renderVoiceFilterPanel();
      saveVoiceEnabledTypes();
      return;
    }
    if (e.target.id === 'voiceFilterNone') {
      voiceEnabledTypes.clear();
      renderVoiceFilterPanel();
      saveVoiceEnabledTypes();
      return;
    }
    if (e.target.id === 'paMasterVoiceCheckbox') {
      const paTitles = ALL_TYPE_TITLES.filter(t => t.startsWith(PRICE_ACTION_PREFIX));
      if (e.target.checked) paTitles.forEach(t => voiceEnabledTypes.add(t));
      else paTitles.forEach(t => voiceEnabledTypes.delete(t));
      renderVoiceFilterPanel();
      saveVoiceEnabledTypes();
      return;
    }
    if (e.target.matches('input[data-voice-title]')) {
      const title = decodeURIComponent(e.target.dataset.voiceTitle);
      if (e.target.checked) voiceEnabledTypes.add(title);
      else voiceEnabledTypes.delete(title);
      if (title.startsWith(PRICE_ACTION_PREFIX)) renderVoiceFilterPanel();
      saveVoiceEnabledTypes();
    }
  });

  // Speaks a short summary of a new alert via the browser's built-in text-to-speech, once voice is
  // on globally AND at least one of this alert's classified types is voice-enabled.
  function speakAlert(alertObj) {
    if (!window.speechSynthesis) return;
    const lines = (alertObj.raw || '').split('\n').map(l => l.trim()).filter(Boolean);
    const headlineLines = lines.filter((l, i) => i === 0 || l.startsWith('•'));
    const titles = getAlertTypeTitles(headlineLines);
    const effectiveTitles = titles.length ? titles : [OTHER_TYPE];
    if (!effectiveTitles.some(t => voiceEnabledTypes.has(t))) return;
    const sym = (getSymbol(alertObj.raw) || 'Alert').replace(/!$/, '');
    const dirMatch = (alertObj.raw || '').match(/\b(LONG|SHORT|Bullish|Bearish)\b/);
    const dir = dirMatch ? dirMatch[1] : '';
    const cleanTitle = (effectiveTitles[0] || OTHER_TYPE).replace(/\s*\([^)]*\)\s*$/, '').replace(/Price Action - /, '');
    const phrase = `${sym}. ${cleanTitle}${dir ? '. ' + dir : ''}`;
    speechSynthesis.cancel(); // don't queue up a backlog if several alerts land in quick succession
    speechSynthesis.speak(new SpeechSynthesisUtterance(phrase));
  }

  // Positions the panel with fixed coords clamped to the viewport, instead of trusting CSS
  // right:0 (which anchors to the button's own position — fine on desktop where the button
  // sits at the far right of a single-row header, but on mobile the header wraps and the
  // button can land left-of-center, pushing a right-anchored 260px panel off the left edge
  // of the screen entirely, with no way to scroll to the clipped checkboxes).
  function positionTypeFilterPanel() {
    const margin = 8;
    const rect = typeFilterBtn.getBoundingClientRect();
    const panelWidth = typeFilterPanel.offsetWidth || 260;
    let left = rect.right - panelWidth; // default: align panel's right edge under the button
    left = Math.min(left, window.innerWidth - margin - panelWidth); // don't overflow right
    left = Math.max(left, margin); // don't overflow left
    let top = rect.bottom + 6;
    top = Math.min(top, window.innerHeight - margin - 40); // keep panel from starting off-bottom
    typeFilterPanel.style.left = left + 'px';
    typeFilterPanel.style.top = top + 'px';
  }
  window.addEventListener('resize', () => {
    if (typeFilterPanel.classList.contains('open')) positionTypeFilterPanel();
  });

  typeFilterBtn.addEventListener('click', (e) => {
    e.stopPropagation();
